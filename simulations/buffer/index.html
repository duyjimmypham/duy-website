/* Layout: a top bar (tabs, + Acid, + Base, Pause, Start over) over two panels: the bench (pH with its indicator colour,
   the beaker beside its bars; two benches on Compare) and the titration curve, pH on a universal indicator axis, acid
   added to the left of 0 and base to the right. Light only. A⁻ is an orange disc with an empty socket, H⁺ the black
   ball that fits it, HA a blue disc with the socket filled, OH⁻ a green square. */
:root {
  --bg: #FFFFFF; --surface: #F3F5F8; --ink: #121A22; --text2: #5E6A76; --faint: #C9D1D9; --liquid: #DFEAF3;
  --ha: #2F62D9; --a: #E8780C; --oh: #0E9F6E; --water: #121A22; --buffer: #0E7C86;
  --body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", Verdana, sans-serif;
  font-size: clamp(16px, 1.3vw, 28px);
}

body {
  background: var(--bg); color: var(--ink); font: 400 1rem/1.3 var(--body);
  padding-block: 1rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 110rem; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem }
[hidden] { display: none !important }
h2 { margin: 0 }
sup { font-size: .7em; line-height: 0 }
canvas { display: block }
canvas.g { width: 1.6rem; height: 1.6rem }
button { font-family: var(--body); cursor: pointer }
:focus-visible { outline: .2rem solid var(--ha); outline-offset: .2rem }

.top { display: flex; align-items: center; gap: .75rem 1rem; flex-wrap: wrap }
[role="tablist"] { display: flex; gap: .25rem; padding: .25rem; background: var(--surface); border-radius: 99rem }
[role="tab"] { border: 0; background: none; border-radius: 99rem; padding: .55rem 1.2rem; font: 700 1.15rem/1 var(--body); color: var(--text2) }
[role="tab"]:hover { color: var(--ink) }
[role="tab"][aria-selected="true"] { background: var(--ink); color: var(--bg) }
.dose { font: 700 1.3rem/1 var(--body); padding: .8rem 1.4rem; border-radius: 99rem; border: .15rem solid var(--ink); white-space: nowrap }
#acid { margin-left: auto; background: var(--ink); color: var(--bg) }
#base { background: var(--bg); color: var(--ink) }
.dose:active:not(:disabled) { transform: translateY(2px) }
.dose:disabled { opacity: .35; cursor: not-allowed }
.quiet { background: none; color: var(--text2); border: 0; padding: .3rem .5rem; font: 600 1rem var(--body); border-radius: .4rem }
.quiet:hover { color: var(--ink) }
.site-nav a { display: flex; align-items: center; gap: .4rem; min-height: 2.75rem; color: inherit; text-decoration: none; font-weight: 600 }
.site-nav a:hover { text-decoration: underline }
.license { margin: 0; font-size: .85rem; color: var(--text2) }
.license a { color: inherit }

.panel { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 1rem }
.panel.compare { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr) }
.benches, .graph { background: var(--surface); border-radius: 1.25rem; padding: 1.25rem; min-width: 0 }
.benches { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2rem }

.bench { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); align-content: start; gap: 1rem 1.5rem; min-width: 0 }
.head { grid-column: 1 / -1; display: grid; justify-items: center }
.name { font: 700 1.3rem/1.2 var(--body); color: var(--text2) }
.panel:not(.compare) .name { display: none }
.read { display: flex; align-items: center; gap: .6rem }
.swatch { width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 .12rem rgba(18, 26, 34, .25); transition: background-color .45s }
.ph { font: 700 clamp(3.5rem, 6vw, 6.5rem)/1 var(--body); font-variant-numeric: tabular-nums }
.compare .ph { font-size: clamp(3rem, 4.6vw, 5rem) }
.change { font: 600 1.4rem/1.2 var(--body); color: var(--text2); font-variant-numeric: tabular-nums; min-height: 1.2em }

.beaker { width: 100%; height: max(15rem, calc(100vh - 21.75rem)); align-self: end }
.chart { display: grid; grid-template-rows: minmax(8rem, 1fr) auto; min-width: 0 }
.plot { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12%; padding-inline: 6%; border-bottom: .15rem solid var(--ink) }
.col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-width: 0 }
.col b { font: 700 1.3rem/1.3 var(--body); font-variant-numeric: tabular-nums }
.col i { width: 100%; height: calc(var(--v, 0) * 5.8%); border-radius: .25rem .25rem 0 0; background: var(--ink) }
.col.ha i { background: var(--ha) }
.col.a i { background: var(--a) }
.col.oh i { background: var(--oh) }
.names { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12%; padding: .5rem 6% 0 }
.names > span { display: grid; justify-items: center; gap: .2rem; font: 600 1.1rem/1.1 var(--body); min-height: 3.1rem }

.curve { display: block; width: 100%; height: max(16rem, calc(100vh - 11.85rem)); overflow: visible }
.curve text { font: 400 .9rem var(--body); fill: var(--text2) }
.curve .label { font-weight: 600; font-size: 1rem }
.curve .tag { font-weight: 700; font-size: 1.05rem }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%) }

@media (max-width: 60rem) {
  .panel, .panel.compare { grid-template-columns: minmax(0, 1fr) }
  .benches { grid-auto-flow: row }
  #acid { margin-left: 0 }
  .beaker { height: 20rem }
  .curve { height: 22rem }
}
@media (prefers-reduced-motion: reduce) { .swatch { transition: none } }
@media (prefers-reduced-motion: no-preference) { @view-transition { navigation: auto } }
</style>
</head>
<body>

<main>
  <div class="top">
    <nav class="site-nav" aria-label="Site navigation"><a href="../../index.html#teaching"><span aria-hidden="true">←</span> Home</a></nav>
    <h1 class="sr">Buffers</h1>
    <div role="tablist" aria-label="Experiment">
      <button role="tab" type="button" data-tab="water">No buffer</button>
      <button role="tab" type="button" data-tab="buffer">Buffer</button>
      <button role="tab" type="button" data-tab="compare">Compare</button>
    </div>
    <button id="acid" type="button" class="dose">+ Acid</button>
    <button id="base" type="button" class="dose">+ Base</button>
    <button id="pause" type="button" class="quiet" aria-pressed="false">Pause</button>
    <button id="reset" type="button" class="quiet">Start over</button>
  </div>
  <div id="panels"></div>
  <p class="sr" aria-live="polite" id="live"></p>
  <p class="license"><a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a></p>
</main>

<template id="bench">
  <div class="bench">
    <div class="head"><h2 class="name"></h2><div class="read"><i class="swatch"></i><span class="ph"></span></div><span class="change"></span></div>
    <canvas class="beaker" role="img"></canvas>
    <div class="chart">
      <div class="plot"><div class="col ha"><b></b><i></i></div><div class="col a"><b></b><i></i></div><div class="col"><b></b><i></i></div></div>
      <div class="names"><span><canvas class="g" data-t="HA"></canvas>HA</span><span><canvas class="g" data-t="A"></canvas><span>A<sup>−</sup></span></span><span class="ion"></span></div>
    </div>
  </div>
</template>

<script>
const KA = 10 ** -4.76, KW = 1e-14, MAX_NET = 16, MAX_ML = 30, SEEK = 110;
const $ = (id) => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const ION = { acid: ["H", "H<sup>+</sup>"], base: ["OH", "OH<sup>−</sup>"] };
const INDICATOR = ["#EE1C25", "#EE1C25", "#F26724", "#F8C611", "#F5ED1C", "#B5D333", "#84C341", "#4DB848", "#33A94B", "#22B46B", "#0AB8B6", "#4690CD", "#3853A4", "#5A51A2", "#63459D"];
const RECIPE = { water: ["Water", [0, 0], "--water"], buffer: ["Buffer", [6, 6], "--buffer"] };

// Exact pH from charge balance. Amounts in mmol, volume in mL.
function solvePH(c, na, cl, v) {
  c /= v; na /= v; cl /= v;
  let lo = 0, hi = 14;
  for (let i = 0; i < 50; i++) {
    const m = (lo + hi) / 2, h = 10 ** -m;
    if (h + na - cl - KW / h - c * KA / (KA + h) > 0) lo = m; else hi = m;
  }
  return (lo + hi) / 2;
}
// pH after `acid` and `base` mL of 1 M added to 100 mL holding ha and a mmol.
const phOf = ([ha, a], acid, base) => solvePH(ha + a, a + base, acid, 100 + acid + base);
const hexRGB = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
const indicator = (pH) => { const i = Math.min(13, Math.max(0, Math.floor(pH))), f = pH - i, a = hexRGB(INDICATOR[i]), b = hexRGB(INDICATOR[i + 1]); return `rgb(${a.map((v, k) => Math.round(v + (b[k] - v) * f))})`; };

const state = { paused: false };

// Whole-mmol bookkeeping: strong acid or base reacts completely with its buffer partner first.
function counts(b) {
  const [ha0, a0] = b.recipe, net = b.tab.n.acid - b.tab.n.base;
  if (net >= 0) return { HA: ha0 + Math.min(net, a0), A: Math.max(0, a0 - net), H: Math.max(0, net - a0), OH: 0 };
  return { HA: Math.max(0, ha0 + net), A: a0 + Math.min(-net, ha0), H: 0, OH: Math.max(0, -net - ha0) };
}

// Each tab is its own experiment: its benches share the drops added on that tab.
function newBeaker(tab, kind) {
  const el = $("bench").content.firstElementChild.cloneNode(true), q = (s) => el.querySelector(s), [name, recipe, color] = RECIPE[kind];
  q(".name").textContent = name;
  q(".beaker").setAttribute("aria-label", "Beaker of " + name.toLowerCase());
  return {
    tab, name, recipe, color, el, canvas: q(".beaker"), ph: q(".ph"), change: q(".change"), swatch: q(".swatch"), ion: q(".ion"),
    cols: [...el.querySelectorAll(".col")], trail: [], key: null,
    parts: [], queue: [], added: { acid: 0, base: 0 }, bars: [0, 0, 0], pip: { pos: 0, hold: 0, timer: 0, kind: "acid" },
  };
}
const tabs = ["water", "buffer", "compare"].map((id) => {
  const tab = { id, n: { acid: 0, base: 0, last: null }, button: document.querySelector(`[data-tab="${id}"]`) };
  tab.panel = Object.assign(document.createElement("section"), { className: "panel" + (id === "compare" ? " compare" : ""), role: "tabpanel", hidden: true });
  tab.beakers = (id === "compare" ? ["water", "buffer"] : [id]).map((k) => newBeaker(tab, k));
  const benches = Object.assign(document.createElement("div"), { className: "benches" }), graph = Object.assign(document.createElement("div"), { className: "graph" });
  tab.curve = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  tab.curve.setAttribute("class", "curve"); tab.curve.setAttribute("role", "img"); tab.curve.setAttribute("aria-label", "Titration curve");
  benches.append(...tab.beakers.map((b) => b.el)); graph.append(tab.curve); tab.panel.append(benches, graph);
  $("panels").append(tab.panel);
  return tab;
});
let active = tabs[0];

// Drawn extents in units of R; particles never come closer than their extents plus a small gap.
const SIZE = { HA: 1.22, A: 0.9, H: 0.36, OH: 0.42 }, GAP = 0.2, SOCKET = 0.62;
const spawn = (t, x = Math.random(), y = Math.random(), z = Math.random()) =>
  ({ t, x, y, z, vx: 0, vy: 0, target: null, claimed: false, dead: false, lens: 0 });

function measure(b) {
  const c = b.canvas, w = c.clientWidth || 300, h = c.clientHeight || 315;
  const cx = w / 2, a = Math.min(w * 0.46, h * 0.36), rimY = h * 0.06, botY = h * 0.97;
  const level = botY - (botY - rimY) * (0.7 + 0.22 * (b.added.acid + b.added.base) / MAX_ML), R = Math.min(26, Math.max(9, a * 0.15));
  b.geo = { w, h, cx, a, rimY, botY, level, R, pipX: cx + a * 0.45, x0: cx - a + R * 1.3, y0: level + R * 1.3, bw: 2 * a - R * 2.6, bh: botY - level - R * 2.6 };
}

function separate(b) {
  const { bw, bh, R } = b.geo, ps = b.parts;
  for (let i = 0; i < ps.length; i++) for (let j = i + 1; j < ps.length; j++) {
    const p = ps[i], q = ps[j];
    if (p.target === q || q.target === p) continue;
    const dx = (p.x - q.x) * bw, dy = (p.y - q.y) * bh, d = Math.hypot(dx, dy) || 0.01, min = (SIZE[p.t] + SIZE[q.t] + GAP) * R;
    if (d >= min) continue;
    // An ion on its way to a partner is never pushed back, so it always arrives; the others make way.
    const push = (min - d) / d, kp = p.target ? 0 : q.target ? 1 : 0.5, kq = 1 - kp;
    p.x += dx * push * kp / bw; p.y += dy * push * kp / bh; q.x -= dx * push * kq / bw; q.y -= dy * push * kq / bh;
  }
  // Ions on their way are not held inside the box, since a socket at the edge can sit just outside it.
  for (const p of ps) if (!p.target) { p.x = Math.min(1, Math.max(0, p.x)); p.y = Math.min(1, Math.max(0, p.y)); }
}

function rebuild(b) {
  const n = counts(b);
  b.parts = []; b.queue = []; b.pip.pos = b.pip.hold = 0;
  b.added = { acid: b.tab.n.acid, base: b.tab.n.base };
  for (const t in n) for (let i = 0; i < n[t]; i++) b.parts.push(spawn(t));
  measure(b);
  for (let i = 0; i < 150; i++) separate(b);
}

function step(b, dt) {
  const { bw, bh, R, pipX, x0 } = b.geo, pip = b.pip;
  // The dropper comes down, releases what is queued, waits a moment, and lifts away.
  if (b.queue.length) {
    pip.kind = b.queue[0];
    pip.pos = Math.min(1, pip.pos + dt * 2.5);
    if (pip.pos === 1 && (pip.timer -= dt) <= 0) {
      const p = spawn(ION[pip.kind][0], (pipX - x0) / bw, 0, 0.7);
      p.vy = 45; b.parts.push(p);
      b.added[b.queue.shift()]++;
      pip.timer = 0.35; pip.hold = 0.8;
    }
  } else if (pip.hold > 0) pip.hold -= dt;
  else pip.pos = Math.max(0, pip.pos - dt * 2);

  for (const p of b.parts) {
    if (p.dead) continue;
    p.lens = Math.max(0, p.lens - dt);
    if ((p.t === "H" || p.t === "OH") && !p.target && !p.claimed) {
      const opp = p.t === "H" ? "OH" : "H", partner = p.t === "H" ? "A" : "HA";
      const free = (q, t) => q.t === t && !q.claimed && !q.target && !q.dead;
      let best = b.parts.find((q) => free(q, opp)), d = Infinity;
      if (!best) for (const q of b.parts) if (free(q, partner)) { const e = Math.hypot((q.x - p.x) * bw, (q.y - p.y) * bh); if (e < d) { d = e; best = q; } }
      if (best) { p.target = best; best.claimed = true; }
    }
    if (p.target) {
      // H⁺ heads for the socket of A⁻, OH⁻ for the ball in the socket of HA.
      const q = p.target, off = q.t === "A" || q.t === "HA" ? SOCKET * R : 0;
      const dx = (q.x - p.x) * bw + off, dy = (q.y - p.y) * bh - off, d = Math.hypot(dx, dy) || 1;
      p.z += (q.z - p.z) * Math.min(1, dt * 3);
      if (d < R * 6 && q.t !== "H" && q.t !== "OH") q.lens = 0.5;
      if (d < R * 0.3) {
        if (q.t === "A") q.t = "HA"; else if (q.t === "HA") q.t = "A"; else q.dead = true;
        q.claimed = false; p.dead = true;
      } else { const v = Math.min(SEEK, d / dt); p.vx = dx / d * v; p.vy = dy / d * v; }
    } else {
      p.vx = (p.vx + (Math.random() - 0.5) * 110 * dt) * (1 - 0.7 * dt);
      p.vy = (p.vy + (Math.random() - 0.5) * 110 * dt) * (1 - 0.7 * dt);
      p.z = Math.min(1, Math.max(0, p.z + (Math.random() - 0.5) * 0.6 * dt));
    }
    p.x += p.vx * dt / bw; p.y += p.vy * dt / bh;
    if (p.x < 0 || p.x > 1) p.vx *= -1;
    if (p.y < 0 || p.y > 1) p.vy *= -1;
  }
  b.parts = b.parts.filter((p) => !p.dead);
  for (let i = 0; i < 6; i++) separate(b);
}

function dose(kind) {
  if ($(kind).disabled) return;
  const n = active.n;
  n[kind]++;
  n.last = kind;
  for (const b of active.beakers) { if (reduce || state.paused) rebuild(b); else b.queue.push(kind); }
  render();
  $("live").textContent = active.beakers.map((b) => `${b.name} pH ${phOf(b.recipe, n.acid, n.base).toFixed(2)}`).join(", ") + ".";
}

function palette() {
  const css = getComputedStyle(document.documentElement), v = (n) => css.getPropertyValue(n).trim();
  return { ink: v("--ink"), surface: v("--surface"), liquid: v("--liquid"), HA: v("--ha"), A: v("--a"), OH: v("--oh") };
}

// A⁻ is a disc with an empty socket, H⁺ the ball that fits it, HA the disc with its socket filled (and blue),
// OH⁻ a square. The socket is cut by painting the background colour behind the particle.
function particle(ctx, t, x, y, R, C, bg) {
  const disc = (dx, dy, r, c) => { ctx.beginPath(); ctx.arc(x + dx, y + dy, r, 0, 6.3); ctx.fillStyle = c; ctx.fill(); };
  const o = SOCKET * R;
  if (t === "HA" || t === "A") {
    disc(0, 0, R * 0.88, t === "HA" ? C.HA : C.A);
    disc(o, -o, R * 0.42, bg);
    if (t === "HA") disc(o, -o, R * 0.34, C.ink);
  } else if (t === "H") disc(0, 0, R * 0.34, C.ink);
  else { const s = R * 0.76; ctx.fillStyle = C.OH; ctx.fillRect(x - s / 2, y - s / 2, s, s); }
}

function fit(c) {
  const dpr = devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  const ctx = c.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return ctx;
}

function draw(b, C) {
  measure(b);
  const ctx = fit(b.canvas), { cx, a, rimY, botY, level, R, pipX, x0, y0, bw, bh } = b.geo, r = a * 0.16, wall = Math.max(2, a * 0.014);
  const cup = (top) => { ctx.beginPath(); ctx.moveTo(cx - a, top); ctx.lineTo(cx - a, botY - r); ctx.quadraticCurveTo(cx - a, botY, cx - a + r, botY); ctx.lineTo(cx + a - r, botY); ctx.quadraticCurveTo(cx + a, botY, cx + a, botY - r); ctx.lineTo(cx + a, top); };

  cup(level); ctx.closePath(); ctx.fillStyle = C.liquid; ctx.fill();
  const px = (p) => x0 + p.x * bw, py = (p) => y0 + p.y * bh;
  for (const p of [...b.parts].sort((p, q) => p.z - q.z)) {
    if (p.lens > 0) {
      ctx.globalAlpha = Math.min(1, p.lens / 0.3) * 0.5;
      ctx.beginPath(); ctx.arc(px(p), py(p), R * 1.9, 0, 6.3); ctx.strokeStyle = C.ink; ctx.lineWidth = wall; ctx.stroke();
      ctx.globalAlpha = 1;
    }
    particle(ctx, p.t, px(p), py(p), R, C, C.liquid);
  }
  ctx.strokeStyle = C.ink; ctx.lineWidth = wall; ctx.lineJoin = "round"; cup(rimY); ctx.stroke();

  if (b.pip.pos > 0) {
    const tip = -a + (level - 6 + a) * b.pip.pos, half = Math.max(5, a * 0.04);
    ctx.fillStyle = C.surface; ctx.lineWidth = wall;
    ctx.beginPath(); ctx.moveTo(pipX, tip); ctx.lineTo(pipX - half, tip - half * 3); ctx.lineTo(pipX - half, tip - a); ctx.lineTo(pipX + half, tip - a); ctx.lineTo(pipX + half, tip - half * 3); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}

// The titration curve: a faint full curve per solution for reference, and the trail of what has reached each beaker.
// x is net base added: acid to the left of 0, base to the right.
function drawCurve(tab) {
  const svg = tab.curve, W = svg.clientWidth, H = svg.clientHeight;
  if (!W || !H) return;
  const rem = parseFloat(getComputedStyle(document.documentElement).fontSize), compare = tab.beakers.length > 1;
  const L = 3.4 * rem, T = 0.6 * rem, Rm = (compare ? 4.4 : 0.6) * rem, B = 3.2 * rem, pw = W - L - Rm, ph = H - T - B;
  const X = (net) => L + (net + MAX_NET) / (2 * MAX_NET) * pw, Y = (pH) => T + (1 - pH / 14) * ph, pts = (list) => list.map(([n, p]) => `${X(n).toFixed(1)},${Y(p).toFixed(1)}`).join(" ");
  const stops = INDICATOR.map((c, i) => `<stop offset="${(1 - i / 14).toFixed(3)}" stop-color="${c}"/>`).reverse().join("");
  let s = `<defs><linearGradient id="ind-${tab.id}" x1="0" y1="0" x2="0" y2="1">${stops}</linearGradient></defs>`;
  s += `<rect x="${L - 1.5 * rem}" y="${T}" width="${0.9 * rem}" height="${ph}" rx="${0.2 * rem}" fill="url(#ind-${tab.id})"/>`;
  for (const v of [0, 7, 14]) s += `<text x="${L - 1.9 * rem}" y="${Y(v)}" text-anchor="end" dominant-baseline="middle">${v}</text>`;
  s += `<path d="M${X(0)},${T} V${T + ph}" stroke="var(--faint)" stroke-width="1.5"/>`;
  s += `<path d="M${L},${T + ph} H${L + pw}" stroke="var(--ink)" stroke-width="${0.12 * rem}"/>`;
  for (const v of [-16, -8, 0, 8, 16]) s += `<text x="${X(v)}" y="${T + ph + 1.1 * rem}" text-anchor="middle">${Math.abs(v)}</text>`;
  const added = pw < 24 * rem ? "" : " added";
  s += `<text class="label" x="${X(-MAX_NET / 2)}" y="${T + ph + 2.6 * rem}" text-anchor="middle">Acid${added} (mL)</text>`;
  s += `<text class="label" x="${X(MAX_NET / 2)}" y="${T + ph + 2.6 * rem}" text-anchor="middle">Base${added} (mL)</text>`;
  for (const b of tab.beakers) {
    const ref = [];
    for (let n = -MAX_NET; n <= MAX_NET; n += 0.25) ref.push([n, phOf(b.recipe, Math.max(-n, 0), Math.max(n, 0))]);
    s += `<polyline points="${pts(ref)}" fill="none" stroke="var(--faint)" stroke-width="${0.12 * rem}" stroke-linejoin="round"/>`;
  }
  for (const b of tab.beakers) {
    const c = compare ? `var(${b.color})` : "var(--ink)", [n0, p0] = b.trail[0], [n1, p1] = b.trail[b.trail.length - 1];
    s += `<polyline points="${pts(b.trail)}" fill="none" stroke="${c}" stroke-width="${0.18 * rem}" stroke-linejoin="round"/>`;
    for (const [n, p] of b.trail.slice(1, -1)) s += `<circle cx="${X(n)}" cy="${Y(p)}" r="${0.2 * rem}" fill="${c}"/>`;
    s += `<circle cx="${X(n0)}" cy="${Y(p0)}" r="${0.42 * rem}" fill="var(--surface)" stroke="${c}" stroke-width="${0.18 * rem}"/>`;
    if (b.trail.length > 1) s += `<circle cx="${X(n1)}" cy="${Y(p1)}" r="${0.55 * rem}" fill="${c}" stroke="var(--surface)" stroke-width="${0.15 * rem}"/>`;
    if (compare) s += `<text class="tag" x="${W - Rm + 0.6 * rem}" y="${Y(p1)}" dominant-baseline="middle" style="fill:${c}">${b.name}</text>`;
  }
  svg.innerHTML = s;
}

// Bars count the particles in the beaker, and the pH is the pH of what has reached it, so numbers follow the picture.
function readouts(b, dt) {
  const n = (t) => b.parts.filter((p) => p.t === t).length, now = [n("HA"), n("A"), n("H") + n("OH")];
  now.forEach((v, i) => {
    b.bars[i] = reduce || state.paused ? v : b.bars[i] + (v - b.bars[i]) * Math.min(1, dt * 6);
    const [num, bar] = b.cols[i].children, text = v ? String(v) : "";
    bar.style.setProperty("--v", Math.min(16, b.bars[i]).toFixed(2));
    if (num.textContent !== text) num.textContent = text;
  });
  const { acid, base } = b.added, key = acid + "," + base;
  if (b.key === key) return false;
  const pH = phOf(b.recipe, acid, base), d = pH - phOf(b.recipe, 0, 0);
  b.key = key;
  b.trail.push([base - acid, pH]);
  b.ph.textContent = pH.toFixed(2);
  b.swatch.style.setProperty("--c", indicator(pH));
  b.change.textContent = Math.abs(d) < 0.005 ? "" : (d < 0 ? "−" : "+") + Math.abs(d).toFixed(2);
  return true;
}

function render() {
  const { acid, base } = active.n, full = acid + base >= MAX_ML;
  $("acid").disabled = full || acid - base >= MAX_NET; $("base").disabled = full || base - acid >= MAX_NET;
  for (const tab of tabs) for (const b of tab.beakers) {
    b.cols[2].classList.toggle("oh", tab.n.last === "base");
    b.ion.innerHTML = tab.n.last ? `<canvas class="g" data-t="${ION[tab.n.last][0]}"></canvas><span>${ION[tab.n.last][1]}</span>` : "";
  }
}

function restart(tab) {
  tab.n = { acid: 0, base: 0, last: null };
  for (const b of tab.beakers) { b.trail = []; b.key = null; rebuild(b); readouts(b, 0); }
  render();
  drawCurve(tab);
}

function show(tab) {
  active = tab;
  for (const t of tabs) { t.panel.hidden = t !== tab; t.button.setAttribute("aria-selected", t === tab); }
  render();
  drawCurve(tab);
}

for (const tab of tabs) tab.button.onclick = () => show(tab);
$("acid").onclick = () => dose("acid");
$("base").onclick = () => dose("base");
$("reset").onclick = () => restart(active);
$("pause").onclick = () => {
  state.paused = !state.paused;
  $("pause").textContent = state.paused ? "Play" : "Pause";
  $("pause").setAttribute("aria-pressed", state.paused);
};
addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase(), id = { a: "acid", b: "base", r: "reset", p: "pause" }[k];
  if (id) $(id).click();
  else if (tabs[k - 1]) show(tabs[k - 1]);
});
new ResizeObserver(() => drawCurve(active)).observe($("panels"));

tabs.forEach(restart);
show(tabs[0]);

let prev = performance.now();
(function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000), C = palette();
  prev = now;
  let changed = false;
  for (const b of active.beakers) { if (!reduce && !state.paused) step(b, dt); draw(b, C); changed = readouts(b, dt) || changed; }
  if (changed) drawCurve(active);
  for (const c of active.panel.querySelectorAll("canvas.g")) { const s = c.clientHeight; particle(fit(c), c.dataset.t, s * 0.45, s * 0.58, s * 0.42, C, C.surface); }
  requestAnimationFrame(frame);
})(prev);
</script>
</body>
