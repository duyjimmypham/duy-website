/* Layout: a top bar (tabs, the active tab's actions, Start over) over two panels.
   Decay: the nucleus firing its particle at paper, aluminum and lead, the nuclear equation with its two balances,
   and beside it a chart of nuclides (neutrons across, protons up) that traces every step of the chain.
   Half-life: a sample of nuclei, each with its own random moment of decay, beside the graph of what is left.
   Light only. Protons red, neutrons grey; each decay mode keeps one colour everywhere. */
:root {
  --bg: #FFFFFF; --surface: #F3F5F8; --ink: #121A22; --text2: #5E6A76; --faint: #C9D1D9;
  --proton: #D9473A; --neutron: #9AA5B1;
  --alpha: #B45309; --bminus: #2563EB; --bplus: #B5179E; --ec: #8A5300; --gamma: #047857;
  --parent: #2563EB; --daughter: #E8780C;
  --body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", Verdana, sans-serif;
  font-size: clamp(16px, 1.3vw, 28px);
}

body {
  background: var(--bg); color: var(--ink); font: 400 1rem/1.35 var(--body); margin: 0;
  padding-block: 1rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 110rem; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem }
[hidden] { display: none !important }
h2 { margin: 0 }
p { margin: 0 }
canvas { display: block }
button, select, input { font-family: var(--body) }
button { cursor: pointer }
:focus-visible { outline: .2rem solid var(--bminus); outline-offset: .2rem }

.top { display: flex; align-items: center; gap: .75rem 1rem; flex-wrap: wrap }
[role="tablist"] { display: flex; gap: .25rem; padding: .25rem; background: var(--surface); border-radius: 99rem }
[role="tab"] { border: 0; background: none; border-radius: 99rem; padding: .55rem 1.2rem; font: 700 1.15rem/1 var(--body); color: var(--text2) }
[role="tab"]:hover { color: var(--ink) }
[role="tab"][aria-selected="true"] { background: var(--ink); color: var(--bg) }
.acts { display: flex; gap: .75rem; margin-left: auto; flex-wrap: wrap }
.dose { font: 700 1.3rem/1 var(--body); padding: .8rem 1.4rem; border-radius: 99rem; border: .15rem solid var(--ink); white-space: nowrap; background: var(--bg); color: var(--ink) }
.dose.primary { background: var(--ink); color: var(--bg); min-width: 7.5rem }
.dose:active:not(:disabled) { transform: translateY(2px) }
.dose:disabled { opacity: .35; cursor: not-allowed }
.quiet { background: none; color: var(--text2); border: 0; padding: .3rem .5rem; font: 600 1rem var(--body); border-radius: .4rem }
.quiet:hover { color: var(--ink) }
.site-nav a { display: flex; align-items: center; gap: .4rem; min-height: 2.75rem; color: inherit; text-decoration: none; font-weight: 600 }
.site-nav a:hover { text-decoration: underline }
.license { margin: 0; font-size: .85rem; color: var(--text2) }
.license a { color: inherit }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%) }

.panel { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 1rem }
.card { background: var(--surface); border-radius: 1.25rem; padding: 1.25rem; min-width: 0; display: grid; align-content: start; gap: 1rem }
.cap { font: 700 1.1rem/1.2 var(--body); color: var(--text2) }
.row { display: flex; align-items: center; gap: .6rem 1rem; flex-wrap: wrap }
label, .lbl { font-weight: 600; color: var(--text2) }
select { min-width: 0; flex: 0 1 auto; font: 600 1.05rem var(--body); color: var(--ink); background: var(--bg); border: .12rem solid var(--faint); border-radius: .6rem; padding: .45rem .6rem; max-width: 100% }
.seg { display: flex; gap: .2rem; padding: .2rem; background: var(--bg); border-radius: 99rem; border: .12rem solid var(--faint) }
.seg button { border: 0; background: none; border-radius: 99rem; padding: .35rem .8rem; font: 700 .95rem/1 var(--body); color: var(--text2) }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg) }

/* Nuclide notation: mass number over atomic number, right-aligned, before the symbol. */
.nuc { display: inline-flex; align-items: center; white-space: nowrap; font-weight: 700 }
.az { display: inline-flex; flex-direction: column; align-items: flex-end; font-size: .52em; line-height: 1.08; margin-right: .1em; font-variant-numeric: tabular-nums }

.now { display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap }
.now .nuc { font-size: clamp(3rem, 5vw, 5.2rem); line-height: 1 }

.facts { color: var(--text2); font-weight: 600 }
.facts b { color: var(--ink) }
.mode { font-weight: 700 }
.scene { width: 100%; height: max(14rem, calc(100vh - 34rem)); background: var(--bg); border-radius: .9rem }

.eq { display: flex; align-items: flex-start; justify-content: center; gap: .4rem .9rem; flex-wrap: wrap; font-size: 2.1rem; min-height: 4.3rem }

.term small { font: 600 .8rem/1.1 var(--body); color: var(--text2); text-align: center; max-width: 9rem }
.op { font-weight: 400; color: var(--text2); line-height: 1.25 }
.q { color: var(--faint); font-weight: 700; line-height: 1.25 }

.note { color: var(--text2); font-size: 1rem; max-width: 46rem }

.chart { display: block; width: 100%; height: max(16rem, calc(100vh - 27rem)); overflow: visible }
.chart text { font: 400 .85rem var(--body); fill: var(--text2) }
.chart .cell-label { font: 700 .9rem var(--body); fill: var(--ink) }
.chart .axis-label { font-weight: 600; font-size: .95rem }

<script id="nuclear-model">
// Nuclide data and decay rules, kept free of the page so check.cjs can verify them.
// Half-lives: NUBASE2020 / ENSDF, rounded. C-14 uses the textbook 5,730 y (NUBASE2020: 5,700 ± 30 y).
window.nuclearModel = (() => {
  const ELEMENTS = {
    1: ["H", "Hydrogen"], 2: ["He", "Helium"], 3: ["Li", "Lithium"], 4: ["Be", "Beryllium"], 5: ["B", "Boron"], 6: ["C", "Carbon"],
    7: ["N", "Nitrogen"], 8: ["O", "Oxygen"], 9: ["F", "Fluorine"], 10: ["Ne", "Neon"], 11: ["Na", "Sodium"], 15: ["P", "Phosphorus"],
    16: ["S", "Sulfur"], 27: ["Co", "Cobalt"], 28: ["Ni", "Nickel"], 43: ["Tc", "Technetium"], 44: ["Ru", "Ruthenium"], 53: ["I", "Iodine"],
    54: ["Xe", "Xenon"], 55: ["Cs", "Cesium"], 56: ["Ba", "Barium"], 82: ["Pb", "Lead"], 83: ["Bi", "Bismuth"], 84: ["Po", "Polonium"],
    86: ["Rn", "Radon"], 88: ["Ra", "Radium"], 90: ["Th", "Thorium"], 91: ["Pa", "Protactinium"], 92: ["U", "Uranium"],
    93: ["Np", "Neptunium"], 95: ["Am", "Americium"],
  };
  // How each mode changes the nucleus, and the particle that leaves it (or, for electron capture, enters it).
  const MODES = {
    alpha: { name: "alpha decay", sign: "α", dZ: -2, dA: -4, out: { A: 4, Z: 2, sym: "He", caption: "alpha particle" } },
    "beta-": { name: "beta decay", sign: "β⁻", dZ: 1, dA: 0, out: { A: 0, Z: -1, sym: "e", caption: "beta particle (an electron)" } },
    "beta+": { name: "positron emission", sign: "β⁺", dZ: -1, dA: 0, out: { A: 0, Z: 1, sym: "e", caption: "positron (an anti-electron)" } },
    ec: { name: "electron capture", sign: "EC", dZ: -1, dA: 0, in: { A: 0, Z: -1, sym: "e", caption: "inner electron" } },
    gamma: { name: "gamma emission", sign: "γ", dZ: 0, dA: 0, out: { A: 0, Z: 0, sym: "γ", caption: "gamma ray" } },
  };
  // Z, A, state ("m" metastable, "*" short-lived excited), half-life [value, unit], mode, daughter, a line about it.
  const N = (Z, A, half, mode, to, about, state = "") => ({ Z, A, half, mode, to, about, state });
  const STABLE = (Z, A) => ({ Z, A, stable: true, state: "" });
  const NUCLIDES = {
    "H-3": N(1, 3, [12.32, "y"], "beta-", "He-3", "Tritium. It makes the glow in self-lit exit signs."),
    "He-3": STABLE(2, 3),
    "Be-7": N(4, 7, [53.22, "d"], "ec", "Li-7", "Made by cosmic rays in the upper atmosphere."),
    "Li-7": STABLE(3, 7),
    "C-11": N(6, 11, [20.34, "min"], "beta+", "B-11", "A tracer for PET scans."),
    "B-11": STABLE(5, 11),
    "C-14": N(6, 14, [5730, "y"], "beta-", "N-14", "Used to date things that were once alive."),
    "N-14": STABLE(7, 14),
    "F-18": N(9, 18, [109.7, "min"], "beta+", "O-18", "The tracer in most PET scans. About 3% decay by electron capture instead."),
    "O-18": STABLE(8, 18),
    "Na-22": N(11, 22, [2.602, "y"], "beta+", "Ne-22*", "Almost every decay leaves neon-22 excited, so a gamma ray follows."),
    "Ne-22*": N(10, 22, null, "gamma", "Ne-22", "Excited neon-22 gives off a 1.27 MeV gamma ray within picoseconds.", "*"),
    "Ne-22": STABLE(10, 22),
    "P-32": N(15, 32, [14.27, "d"], "beta-", "S-32", "Used to label DNA in biology labs."),
    "S-32": STABLE(16, 32),
    "Co-60": N(27, 60, [5.271, "y"], "beta-", "Ni-60*", "Used in radiation therapy and to sterilize food and medical tools."),
    "Ni-60*": N(28, 60, null, "gamma", "Ni-60", "Excited nickel-60 settles within picoseconds, giving off two gamma rays, 1.17 and 1.33 MeV. Shown here as one step.", "*"),
    "Ni-60": STABLE(28, 60),
    "Tc-99m": N(43, 99, [6.01, "h"], "gamma", "Tc-99", "The most used medical tracer. Its 140 keV gamma ray is easy for cameras to see.", "m"),
    "Tc-99": N(43, 99, [2.11e5, "y"], "beta-", "Ru-99", "The long-lived ground state of technetium-99."),
    "Ru-99": STABLE(44, 99),
    "I-131": N(53, 131, [8.02, "d"], "beta-", "Xe-131", "Used to treat thyroid disease. Most decays are followed by a 364 keV gamma ray."),
    "Xe-131": STABLE(54, 131),
    "Cs-137": N(55, 137, [30.1, "y"], "beta-", "Ba-137m", "A fission product. About 95% of decays leave metastable barium-137m."),
    "Ba-137m": N(56, 137, [2.552, "min"], "gamma", "Ba-137", "Gives off the 662 keV gamma ray that cesium-137 is known for.", "m"),
    "Ba-137": STABLE(56, 137),
    "Am-241": N(95, 241, [432.6, "y"], "alpha", "Np-237", "The alpha source in ionization smoke detectors. A weak 59.5 keV gamma ray usually follows."),
    "Np-237": { Z: 93, A: 237, half: [2.144e6, "y"], mode: "alpha", more: true, state: "", about: "Radioactive too, but it lasts millions of years. Its next step is alpha decay to protactinium-233; the chain continues past what this simulation shows." },
    // The uranium-238 series, main branch: 8 alpha and 6 beta decays to lead-206.
    "U-238": N(92, 238, [4.468e9, "y"], "alpha", "Th-234", "The most common uranium. Its chain ends at lead-206 after 14 steps."),
    "Th-234": N(90, 234, [24.1, "d"], "beta-", "Pa-234m"),
    "Pa-234m": N(91, 234, [1.16, "min"], "beta-", "U-234", "", "m"),
    "U-234": N(92, 234, [2.455e5, "y"], "alpha", "Th-230"),
    "Th-230": N(90, 230, [7.54e4, "y"], "alpha", "Ra-226"),
    "Ra-226": N(88, 226, [1600, "y"], "alpha", "Rn-222", "Discovered by Marie and Pierre Curie."),
    "Rn-222": N(86, 222, [3.82, "d"], "alpha", "Po-218", "A gas that seeps from the ground into basements."),
    "Po-218": N(84, 218, [3.1, "min"], "alpha", "Pb-214"),
    "Pb-214": N(82, 214, [27.1, "min"], "beta-", "Bi-214"),
    "Bi-214": N(83, 214, [19.9, "min"], "beta-", "Po-214"),
    "Po-214": N(84, 214, [164, "µs"], "alpha", "Pb-210"),
    "Pb-210": N(82, 210, [22.2, "y"], "beta-", "Bi-210"),
    "Bi-210": N(83, 210, [5.01, "d"], "beta-", "Po-210"),
    "Po-210": N(84, 210, [138.4, "d"], "alpha", "Pb-206", "Found in tobacco smoke."),
    "Pb-206": STABLE(82, 206),
  };
  // Starting points offered on the Decay tab, grouped by mode.
  const STARTS = [
    ["Alpha", ["U-238", "Ra-226", "Am-241", "Po-210"]],
    ["Beta", ["C-14", "H-3", "P-32", "I-131", "Co-60", "Cs-137"]],
    ["Positron", ["F-18", "C-11", "Na-22"]],
    ["Electron capture", ["Be-7"]],
    ["Gamma", ["Tc-99m"]],
  ];
  // Half-life tab: what each sample decays into. U-238's daughters are all far shorter-lived, so over
  // geological time it behaves as uranium-238 turning into lead-206, which is how uranium-lead dating works.
  const HALF_LIFE = {
    "C-14": "N-14", "H-3": "He-3", "P-32": "S-32", "I-131": "Xe-131", "Co-60": "Ni-60", "Cs-137": "Ba-137",
    "Tc-99m": "Tc-99", "F-18": "O-18", "C-11": "B-11", "Po-210": "Pb-206", "Am-241": "Np-237", "U-238": "Pb-206",
  };

  const info = (key) => {
    const n = NUCLIDES[key], [symbol, element] = ELEMENTS[n.Z];
    return { key, ...n, symbol, element, N: n.A - n.Z, name: `${element}-${n.A}${n.state === "m" ? "m" : ""}${n.state === "*" ? " (excited)" : ""}` };
  };
  // One decay as an equation: left and right terms, each { A, Z, sym }, with the two sums.
  function decay(key) {
    const p = info(key);
    if (p.stable || p.more) return null;
    const mode = MODES[p.mode], d = info(p.to);
    const term = (x) => ({ A: x.A, Z: x.Z, sym: x.symbol || x.sym, state: x.state || "", caption: x.caption || "", key: x.key });
    const left = [term(p)], right = [term(d)];
    if (mode.in) left.push(term(mode.in));
    if (mode.out) right.push(term(mode.out));
    const sum = (side, k) => side.reduce((s, t) => s + t[k], 0);
    return { parent: p, daughter: d, mode: p.mode, left, right, A: [sum(left, "A"), sum(right, "A")], Z: [sum(left, "Z"), sum(right, "Z")] };
  }
  // Follow a nuclide to a stable end (or to where the data stops).
  function chain(key) {
    const steps = [];
    for (let k = key, s; (s = decay(k)); k = s.daughter.key) steps.push(s);
    return steps;
  }
  // A sample's decay times, in half-lives. Each nucleus decays at t = −log₂(U) with U uniform on (0, 1]:
  // the exponential law, so the fraction surviving to t is (½)^t on average.
  function sample(n, seed) {
    let a = seed >>> 0;
    const rand = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    return Float64Array.from({ length: n }, () => -Math.log2(1 - rand()));
  }
  const remaining = (times, t) => times.reduce((s, x) => s + (x > t), 0);
  const fraction = (halfLives) => 0.5 ** halfLives;
  const halfLivesFor = (fractionLeft) => -Math.log2(fractionLeft);
  return { ELEMENTS, MODES, NUCLIDES, STARTS, HALF_LIFE, info, decay, chain, sample, remaining, fraction, halfLivesFor };
})();
</script>

<script>
const M = window.nuclearModel;
const $ = (id) => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const rem = () => parseFloat(getComputedStyle(document.documentElement).fontSize);
const UNITS = { y: ["year", "years"], d: ["day", "days"], h: ["hour", "hours"], min: ["minute", "minutes"], s: ["second", "seconds"], "µs": ["microsecond", "microseconds"] };
const MODE_VAR = { alpha: "--alpha", "beta-": "--bminus", "beta+": "--bplus", ec: "--ec", gamma: "--gamma" };
const modeColor = (mode) => css(MODE_VAR[mode]);

// Numbers: whole and grouped below a million, then in millions or billions, at most 4 significant figures.
function num(v, sig = 4) {
  const f = (x) => Number(x.toPrecision(sig)).toLocaleString("en-US", { maximumFractionDigits: 6 });
  if (Math.abs(v) >= 1e9) return f(v / 1e9) + " billion";
  if (Math.abs(v) >= 1e6) return f(v / 1e6) + " million";
  return f(v);
}
const timeText = (v, unit) => `${num(v)} ${UNITS[unit][v === 1 ? 0 : 1]}`;
const halfText = (n) => n.half ? timeText(n.half[0], n.half[1]) : "trillionths of a second";
const minus = (v) => (v < 0 ? "−" + -v : String(v));
function nuc(t) {
  const A = t.A + (t.state === "m" ? "m" : ""), star = t.state === "*" ? `<span class="ex">*</span>` : "";
  return `<span class="nuc"><span class="az"><span>${A}</span><span>${minus(t.Z)}</span></span>${t.sym}${star}</span>`;
}
const plain = (key) => key.replace("-", "‑");

/* ---------- Decay tab ---------- */

const decayState = { start: "U-238", steps: [], at: "U-238", anim: null, auto: false, wait: 0, result: null };
const scene = $("scene"), sctx = scene.getContext("2d");
let nucleons = [];   // { p: proton?, x, y (unit disc), tx, ty, flash }
const GOLDEN = Math.PI * (3 - Math.sqrt(5));

// Nucleons sit on a sunflower spiral in the unit disc; the seed fixes which slots hold protons.
function slots(A) { return Array.from({ length: A }, (_, i) => { const r = Math.sqrt((i + 0.5) / A), a = i * GOLDEN; return [r * Math.cos(a), r * Math.sin(a)]; }); }
function buildNucleus(key) {
  const n = M.NUCLIDES[key], s = slots(n.A);
  let seed = n.A * 131 + n.Z * 7;
  const rnd = () => ((seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648);
  const types = Array.from({ length: n.A }, (_, i) => i < n.Z);
  for (let i = types.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [types[i], types[j]] = [types[j], types[i]]; }
  nucleons = s.map(([x, y], i) => ({ p: types[i], x, y, tx: x, ty: y, flash: 0 }));
}
function relayout() { const s = slots(nucleons.length); nucleons.forEach((b, i) => { b.tx = s[i][0]; b.ty = s[i][1]; }); }

function fillStarts() {
  $("start").innerHTML = M.STARTS.map(([group, keys]) => `<optgroup label="${group}">${keys.map((k) => `<option value="${k}">${M.info(k).name} (${k})</option>`).join("")}</optgroup>`).join("");
  $("start").value = decayState.start;
}

function geometry() {
  const W = scene.clientWidth, H = scene.clientHeight, A = M.NUCLIDES[decayState.at].A;
  const big = Math.min(W * 0.15, H * 0.34), k = big / Math.cbrt(241);
  return { W, H, cx: Math.max(W * 0.17, big + 12), cy: H * 0.46, R: Math.max(10, k * Math.cbrt(A)), k,
    paper: W * 0.47, al: W * 0.63, lead: W * 0.79, alW: Math.max(8, W * 0.012), leadW: Math.max(20, W * 0.04), top: H * 0.12, bot: H * 0.8 };

// One cached shaded ball per colour and size.
const sprites = new Map();

    g.addColorStop(0, "rgba(255,255,255,.85)"); g.addColorStop(0.35, color); g.addColorStop(1, shade(color, 0.6));

function drawBall(ctx, color, x, y, r) { ctx.drawImage(ball(color, r), x - r, y - r, r * 2, r * 2); }

function drawShield(ctx, x, w, g, fill, label, edge) {

function drawScene(now) {
  const d = devicePixelRatio || 1, W = scene.clientWidth, H = scene.clientHeight;
  if (!W || !H) return;
  if (scene.width !== Math.round(W * d) || scene.height !== Math.round(H * d)) { scene.width = Math.round(W * d); scene.height = Math.round(H * d); }
  const ctx = sctx; ctx.setTransform(d, 0, 0, d, 0, 0); ctx.clearRect(0, 0, W, H);
  const g = geometry(), a = decayState.anim, cur = M.NUCLIDES[decayState.at];
  drawShield(ctx, g.paper, 4, g, "#F1E8D2", "Paper", "#C9B88F");
  drawShield(ctx, g.al, g.alW, g, "#D5DAE0", "Aluminum", "#9AA5B1");
  drawShield(ctx, g.lead, g.leadW, g, "#5B6570", "Lead", "#3B434C");

  // Electron shell, shown for electron capture so the captured electron has somewhere to come from.
  const showShell = (cur.mode === "ec" && !a) || (a && a.mode === "ec");
  if (showShell) {
    ctx.strokeStyle = css("--faint"); ctx.lineWidth = 1.5; ctx.setLineDash([4, 5]);
    ctx.beginPath(); ctx.arc(g.cx, g.cy, g.R * 2.3, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    const spin = now / 1400;
    for (let i = 0; i < 2; i++) {

      const ang = spin + i * Math.PI;
      drawBall(ctx, css("--bminus"), g.cx + g.R * 2.3 * Math.cos(ang), g.cy + g.R * 2.3 * Math.sin(ang), Math.max(4, g.k * 0.9));
    }
  }

  // Excited nuclei shimmer until they let their gamma ray go.
  const excited = cur.mode === "gamma" && !(a && a.t > 0.25);
  if (excited) {
    const pulse = 0.5 + 0.5 * Math.sin(now / 160), glow = ctx.createRadialGradient(g.cx, g.cy, g.R * 0.6, g.cx, g.cy, g.R * 1.9);
    glow.addColorStop(0, `rgba(4,120,87,${0.22 + 0.18 * pulse})`); glow.addColorStop(1, "rgba(4,120,87,0)");
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(g.cx, g.cy, g.R * 1.9, 0, 7); ctx.fill();

    const b = nucleons[i], j = excited && !reduce ? 0.05 / Math.sqrt(nucleons.length) : 0;
    const x = g.cx + (b.x + j * Math.sin(now / 37 + i)) * g.R, y = g.cy + (b.y + j * Math.cos(now / 41 + i * 1.7)) * g.R;

}

// Where each emission stops and what to say about it.
function stopFor(mode, g) {
  return { alpha: [g.paper - 10, "Stopped by paper"], "beta-": [g.al + 3, "Stopped by aluminum"], "beta+": [g.al + 3, "Stopped by aluminum"],
    gamma: [g.W - 8, "Lead absorbs most of it"], ec: [g.cx + g.R * 4.2, "Only X-rays and a neutrino leave"] }[mode];

function drawEmission(ctx, g, a, r) {
  const t = a.t, col = modeColor(a.mode), y = g.cy, x0 = g.cx + g.R + r;
  const [xs, label] = stopFor(a.mode, g), fly = Math.min(1, Math.max(0, (t - 0.25) / 1.1)), ease = 1 - (1 - fly) ** 2;
  const fade = t > 1.9 ? Math.max(0, 1 - (t - 1.9) / 0.6) : 1;
  ctx.save(); ctx.globalAlpha = fade;

    const x = x0 + (xs - x0) * ease, rr = r * 0.95;
    [[-0.5, -0.5, 1], [0.5, -0.5, 0], [-0.5, 0.5, 0], [0.5, 0.5, 1]].forEach(([dx, dy, p]) => drawBall(ctx, p ? css("--proton") : css("--neutron"), x + dx * rr * 1.5, y + dy * rr * 1.5, rr));
    tag(ctx, "α", x, y - rr * 2.4, col);
  } else if (a.mode === "beta-" || a.mode === "beta+") {
    const x = x0 + (xs - x0) * ease, rr = Math.max(4, r * 0.7);
    drawBall(ctx, col, x, y, rr); tag(ctx, a.mode === "beta-" ? "e⁻" : "e⁺", x, y - rr * 2.2, col);
    if (a.mode === "beta+" && t > 1.35) {   // the positron meets an electron: two 511 keV gamma rays, back to back
      const s = Math.min(1, (t - 1.35) / 0.55) * (g.bot - g.top) * 0.55, gc = modeColor("gamma");

      wave(ctx, rr, rr + s, 0, 5, gc); wave(ctx, -rr - s, -rr, 0, 5, gc); ctx.restore();
      tag(ctx, "two γ rays", x + 1.2 * rem(), y + s * 0.6, gc, "left");
    }

    const inLead = Math.min(head, g.lead + g.leadW);
    wave(ctx, tail, inLead, y, 7, col);
    if (head > g.lead + g.leadW) wave(ctx, Math.max(tail, g.lead + g.leadW), head, y, 7, col, 0.22);
    tag(ctx, "γ", Math.min(head, g.lead) - 10, y - 1.3 * rem(), col);
  } else if (a.mode === "ec") {   // the inner electron spirals in, then an X-ray leaves the shell as it refills

    if (sp < 1) drawBall(ctx, css("--bminus"), g.cx + rad * Math.cos(ang), g.cy + rad * Math.sin(ang), Math.max(4, g.k * 0.9));

function startAnimation(step) {
  const mode = step.mode;
  // Nucleons change at the moment of decay, so the picture always holds the nucleus named above it.
  if (mode === "alpha") {
    const out = [];
    for (const p of [true, false]) nucleons.map((b, i) => [b.x, i]).filter(([, i]) => nucleons[i].p === p).sort((u, v) => v[0] - u[0]).slice(0, 2).forEach(([, i]) => out.push(i));
    nucleons = nucleons.filter((_, i) => !out.includes(i));
    relayout();
  } else if (mode === "beta-" || mode === "beta+" || mode === "ec") {
    const want = mode === "beta-" ? false : true;   // β⁻ turns a neutron into a proton; β⁺ and EC the reverse
    const pick = nucleons.map((b, i) => [b.x - (mode === "ec" ? 0 : 0), i]).filter(([, i]) => nucleons[i].p === want).sort((u, v) => v[0] - u[0])[0][1];
    nucleons[pick].p = !want; nucleons[pick].flash = 1;
  }
  decayState.anim = { mode, t: 0, dur: mode === "beta+" ? 2.6 : 2.4 };
  decayState.result = null;
  if (reduce) decayState.anim.t = 1.5;
}

function doDecay() {
  if (decayState.anim) return;
  const step = M.decay(decayState.at);
  if (!step) return;
  decayState.steps.push(step);
  decayState.at = step.daughter.key;
  startAnimation(step);
  renderDecay();
  $("live").textContent = `${step.parent.name} undergoes ${M.MODES[step.mode].name} and becomes ${step.daughter.name}.`;
}

function equationHTML(step, key) {
  if (!step) {
    const p = M.info(key);
    if (p.stable) return `<div class="term">${nuc({ ...p, sym: p.symbol })}<small>stable</small></div>`;
    const mode = M.MODES[p.mode], q = `<span class="q">?</span>`;
    const left = [`<div class="term">${nuc({ ...p, sym: p.symbol })}<small>${p.name}</small></div>`];
    if (mode.in) left.push(`<span class="op">+</span><div class="term">${nuc(mode.in)}<small>${mode.in.caption}</small></div>`);
    return `${left.join("")}<span class="op">→</span>${q}${mode.out ? `<span class="op">+</span>${q}` : ""}`;
  }
  const term = (t) => `<div class="term">${nuc(t)}<small>${t.caption || M.info(t.key).name}</small></div>`;
  return `${step.left.map(term).join('<span class="op">+</span>')}<span class="op">→</span>${step.right.map(term).join('<span class="op">+</span>')}`;
}
function balanceHTML(step) {
  if (!step) return "";
  const side = (s, k) => s.map((t) => (t[k] < 0 ? `(${minus(t[k])})` : t[k])).join(" + ");
  const line = (label, k) => {
    const L = side(step.left, k), R = side(step.right, k), [a, b] = step[k];
    return `<span>${label}</span><span>${L}${step.left.length > 1 ? ` = ${minus(a)}` : ""} → ${R}${step.right.length > 1 ? ` = ${minus(b)}` : ""} ${a === b ? '<span class="ok">✓ balanced</span>' : "✗"}</span>`;

const NOTES = {
  alpha: "The nucleus throws out 2 protons and 2 neutrons together: a helium-4 nucleus. The mass number drops by 4 and the atomic number by 2.",
  "beta-": "A neutron turns into a proton and an electron, and the electron is thrown out. The mass number stays the same; the atomic number goes up by 1. An antineutrino also leaves, with no charge and almost no mass.",
  "beta+": "A proton turns into a neutron and a positron (an anti-electron), and the positron is thrown out. The atomic number goes down by 1. A neutrino also leaves.",
  ec: "The nucleus pulls in one of its own inner electrons, which turns a proton into a neutron. The atomic number goes down by 1. A neutrino leaves, and X-rays follow as the electron shells refill.",
  gamma: "An excited nucleus settles down by giving off a gamma ray, which is very high-energy light. No particles leave, so neither number changes.",
};

function renderDecay() {
  const p = M.info(decayState.at), last = decayState.steps[decayState.steps.length - 1];
  $("now-sym").innerHTML = nuc({ ...p, sym: p.symbol });
  $("now-name").textContent = p.name;
  const mode = p.mode && !p.stable ? `<span class="mode" style="color:${modeColor(p.mode)}">${M.MODES[p.mode].name}</span>` : "";
  $("now-facts").innerHTML = `<b>${p.Z}</b> protons, <b>${p.N}</b> neutrons<br>` +
    (p.stable ? "Stable: it does not decay." : `Mode: ${mode}. Half-life: <b>${halfText(p)}</b>`);
  const showLast = last && (decayState.anim || !p.mode || p.stable || p.more || decayState.auto || decayState.showLast);
  $("eq").innerHTML = showLast ? equationHTML(last) : equationHTML(null, decayState.at);
  $("balance").innerHTML = showLast ? balanceHTML(last) : "";
  const about = p.about ? p.about + " " : "";
  $("note").textContent = showLast ? NOTES[last.mode] : p.stable ? (decayState.steps.length ? "The chain has reached a stable nucleus." : "") : p.more ? about : about + "Predict the products, then press Decay.";
  const done = p.stable || p.more;
  $("decay").disabled = done || !!decayState.anim;
  $("auto").disabled = done && !decayState.auto;
  $("auto").textContent = decayState.auto ? "Stop" : "Decay to the end";
  $("auto").setAttribute("aria-pressed", decayState.auto);
  scene.setAttribute("aria-label", `${p.name} nucleus with ${p.Z} protons and ${p.N} neutrons, next to sheets of paper, aluminum and lead`);
  renderLog();
  drawChart();
}

function renderLog() {
  const t = (s) => ({ A: s.A, Z: s.Z, sym: s.symbol, state: s.state });
  $("log").innerHTML = decayState.steps.map((s, i) => `<li><span class="badge" style="color:${modeColor(s.mode)}">${M.MODES[s.mode].sign}</span><span>${i + 1}. ${nuc(t(s.parent))} <span class="op">→</span> ${nuc(t(s.daughter))}</span><span class="t">t½ ${halfText(s.parent)}</span></li>`).join("");
  $("log").scrollTop = $("log").scrollHeight;
}

// Chart of nuclides. The window fits the whole chain from the starting nuclide, so it never jumps as you go;
// only cells already visited are drawn, plus a dashed "?" for the next one.
function drawChart() {
  const svg = $("chart"), W = svg.clientWidth, H = svg.clientHeight;
  if (!W || !H) return;
  const all = [M.info(decayState.start), ...M.chain(decayState.start).map((s) => s.daughter)];
  const Ns = all.map((n) => n.N), Zs = all.map((n) => n.Z);
  let n0 = Math.min(...Ns) - 1, n1 = Math.max(...Ns) + 1, z0 = Math.min(...Zs) - 1, z1 = Math.max(...Zs) + 1;
  while (n1 - n0 < 5) { n0--; n1++; }
  while (z1 - z0 < 5) { z0--; z1++; }
  const R = rem(), L = 3.6 * R, T = 0.6 * R, B = 2.8 * R, Rm = 0.6 * R;
  // Cells may be taller than wide so a long chain still fills the panel.
  const cw = (W - L - Rm) / (n1 - n0 + 1), chh = Math.min((H - T - B) / (z1 - z0 + 1), cw * 1.6, 4.5 * R), cell = Math.min(cw, chh);
  const gw = cw * (n1 - n0 + 1), gh = chh * (z1 - z0 + 1), ox = L, oy = T;
  const X = (n) => ox + (n - n0 + 0.5) * cw, Y = (z) => oy + (z1 - z + 0.5) * chh;
  let s = `<defs>${Object.keys(MODE_VAR).map((m) => `<marker id="ar-${m.replace("+", "p")}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${modeColor(m)}"/></marker>`).join("")}</defs>`;
  s += `<rect x="${ox}" y="${oy}" width="${gw}" height="${gh}" fill="var(--bg)" rx="${0.3 * R}"/>`;
  for (let n = n0; n <= n1 + 1; n++) s += `<path d="M${ox + (n - n0) * cw},${oy} V${oy + gh}" stroke="var(--surface)" stroke-width="1"/>`;
  for (let z = z0; z <= z1 + 1; z++) s += `<path d="M${ox},${oy + (z - z0) * chh} H${ox + gw}" stroke="var(--surface)" stroke-width="1"/>`;
  // N = Z line where it crosses the window: light nuclei are stable near it, heavy ones need extra neutrons.
  const lo = Math.max(n0, z0), hi = Math.min(n1, z1);
  if (lo <= hi) s += `<path d="M${X(lo - 0.5)},${Y(lo - 0.5)} L${X(hi + 0.5)},${Y(hi + 0.5)}" stroke="var(--faint)" stroke-width="2" stroke-dasharray="6 6"/><text x="${X(hi + 0.5) + 4}" y="${Y(hi + 0.5) + 4}" dominant-baseline="hanging">N = Z</text>`;
  const every = Math.ceil((z1 - z0 + 1) / Math.max(1, Math.floor(gh / (1.1 * R))));
  for (let z = z0; z <= z1; z++) if ((z1 - z) % every === 0) s += `<text x="${ox - 0.4 * R}" y="${Y(z)}" text-anchor="end" dominant-baseline="middle">${z} ${M.ELEMENTS[z] ? M.ELEMENTS[z][0] : ""}</text>`;
  const everyN = Math.ceil((n1 - n0 + 1) / Math.max(1, Math.floor(gw / (2.2 * R))));
  for (let n = n0; n <= n1; n++) if ((n - n0) % everyN === 0) s += `<text x="${X(n)}" y="${oy + gh + 1.1 * R}" text-anchor="middle">${n}</text>`;
  s += `<text class="axis-label" x="${ox + gw / 2}" y="${oy + gh + 2.4 * R}" text-anchor="middle">Neutrons (N)</text>`;
  s += `<text class="axis-label" transform="translate(${0.9 * R},${oy + gh / 2}) rotate(-90)" text-anchor="middle">Protons (Z)</text>`;

  const visited = [M.info(decayState.start), ...decayState.steps.map((x) => x.daughter)];
  const nextStep = M.decay(decayState.at);
  const box = (n, z, cls) => `<rect x="${X(n) - cw * 0.44}" y="${Y(z) - chh * 0.44}" width="${cw * 0.88}" height="${chh * 0.88}" rx="${cell * 0.15}" ${cls}/>`;
  if (nextStep && nextStep.mode !== "gamma") s += box(nextStep.daughter.N, nextStep.daughter.Z, `fill="none" stroke="var(--text2)" stroke-width="1.5" stroke-dasharray="4 4"`) + `<text x="${X(nextStep.daughter.N)}" y="${Y(nextStep.daughter.Z)}" text-anchor="middle" dominant-baseline="central" class="cell-label" style="fill:var(--text2)">?</text>`;
  const fs = Math.min(0.9 * R, cell * 0.3);
  const cur = visited[visited.length - 1];
  const seen = new Set();
  for (const v of visited) {
    const id = v.N + "," + v.Z;
    if (seen.has(id) && v !== cur) continue;

    const show = isCur ? cur : v;

    if (cell > 1.9 * R) s += `<text x="${X(show.N)}" y="${Y(show.Z)}" text-anchor="middle" dominant-baseline="central" class="cell-label" style="font-size:${fs}px;fill:${isCur ? "var(--bg)" : "var(--ink)"}"><tspan font-size="${fs * 0.72}px" dy="${-fs * 0.3}">${show.A}${show.state === "m" ? "m" : ""}</tspan><tspan dy="${fs * 0.3}">${show.symbol}${show.state === "*" ? "*" : ""}</tspan></text>`;
  }
  // Cells too small to label: name the current nucleus in a tag beside it.
  if (cell <= 1.9 * R) {
    const lab = `${cur.symbol}-${cur.A}${cur.state === "m" ? "m" : cur.state}`, tw = lab.length * 0.6 * R + 0.8 * R, right = X(cur.N) + cw * 0.6 + tw < ox + gw;
    const tx = right ? X(cur.N) + cw * 0.6 : X(cur.N) - cw * 0.6 - tw, ty = Y(cur.Z) - chh * 0.5 - 1.5 * R < oy ? Y(cur.Z) + chh * 0.5 + 0.2 * R : Y(cur.Z) - chh * 0.5 - 1.5 * R;
    s += `<rect x="${tx}" y="${ty}" width="${tw}" height="${1.4 * R}" rx="${0.3 * R}" fill="var(--ink)"/><text x="${tx + tw / 2}" y="${ty + 0.72 * R}" text-anchor="middle" dominant-baseline="central" class="cell-label" style="fill:var(--bg)">${lab}</text>`;
  }
  // Arrows, one per decay. A gamma step does not move the nucleus, so it loops back on its own cell.
  decayState.steps.forEach((st) => {
    const c = modeColor(st.mode), mk = `url(#ar-${st.mode.replace("+", "p")})`, a = st.parent, b = st.daughter;
    if (st.mode === "gamma") {
      const rr = Math.max(6, cell * 0.2), x = X(a.N) + cw * 0.44 + rr * 0.6, y = Y(a.Z) - chh * 0.44 - rr * 0.6;
      s += `<path d="M${x - rr * 0.2},${y + rr * 0.9} A${rr},${rr} 0 1 1 ${x - rr * 0.9},${y + rr * 0.2}" fill="none" stroke="${c}" stroke-width="2.5" marker-end="${mk}"/>`;
      return;
    }
    const x1 = X(a.N), y1 = Y(a.Z), x2 = X(b.N), y2 = Y(b.Z), len = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / len, uy = (y2 - y1) / len, cut = Math.hypot(ux * cw, uy * chh) * 0.47;
    s += `<path d="M${x1 + ux * cut},${y1 + uy * cut} L${x2 - ux * cut},${y2 - uy * cut}" stroke="${c}" stroke-width="3" marker-end="${mk}"/>`;
  });
  svg.innerHTML = s;
  svg.setAttribute("aria-label", `Chart of nuclides showing ${visited.length} nuclides visited, now at ${cur.name}`);
}

function restartDecay() {
  decayState.steps = []; decayState.at = decayState.start; decayState.anim = null; decayState.auto = false; decayState.result = null;
  buildNucleus(decayState.at);
  renderDecay();
}

function stepDecay(dt) {
  for (const b of nucleons) { b.x += (b.tx - b.x) * Math.min(1, dt * 6); b.y += (b.ty - b.y) * Math.min(1, dt * 6); b.flash = Math.max(0, b.flash - dt * 0.8); }
  const a = decayState.anim;
  if (a) {
    a.t += dt;
    if (a.t >= a.dur) {
      const g = geometry(), [x, text] = stopFor(a.mode, g);
      decayState.result = [text, a.mode === "ec" ? g.cx + g.R * 3 : Math.min(x, g.W - 6 * rem()), modeColor(a.mode)];
      decayState.anim = null; decayState.showLast = true; decayState.wait = 0.5;
      renderDecay();
    }
  } else if (decayState.auto) {
    decayState.wait -= dt;
    const p = M.NUCLIDES[decayState.at];
    if (p.stable || p.more) { decayState.auto = false; renderDecay(); }
    else if (decayState.wait <= 0) doDecay();
  }
}

/* ---------- Half-life tab ---------- */

const SECONDS_PER_HALF = 3, T_MAX = 7;
const hl = { key: "C-14", n: 400, times: null, t: 0, playing: false, target: null, flash: null, seed: 1 };
const grid = $("hl-grid"), gctx = grid.getContext("2d");

function fillHalfPicker() {
  $("hl-pick").innerHTML = Object.keys(M.HALF_LIFE).map((k) => `<option value="${k}">${M.info(k).name} (${halfText(M.NUCLIDES[k])})</option>`).join("");
  $("hl-pick").value = hl.key;
}
function restartHalf() {
  hl.seed = (Math.random() * 2 ** 32) >>> 0;
  hl.times = M.sample(hl.n, hl.seed);
  hl.flash = new Float32Array(hl.n);
  hl.t = 0; hl.playing = false; hl.target = null;
  const n = M.NUCLIDES[hl.key];
  $("c-t").value = Number((n.half[0] * 2).toPrecision(6));
  $("c-unit").textContent = UNITS[n.half[1]][1];
  for (const b of document.querySelectorAll(".seg button")) b.setAttribute("aria-pressed", +b.dataset.n === hl.n);
  renderHalf(); calc();
}
function setPlaying(on) {
  hl.playing = on;
  if (on && hl.t >= T_MAX - 1e-9) { restartHalf(); hl.playing = true; }
  $("play").textContent = hl.playing ? "Pause" : hl.t > 0 ? "Play" : "Play";
  $("play").setAttribute("aria-pressed", hl.playing);
}

function renderHalf() {
  const n = M.NUCLIDES[hl.key], info = M.info(hl.key), left = M.remaining(hl.times, hl.t), pct = 100 * left / hl.n;
  const daughter = M.info(M.HALF_LIFE[hl.key]);
  $("hl-pct").innerHTML = pct.toFixed(1) + '%<small> left</small>';
  $("hl-count").innerHTML = `<span><i class="dot" style="--c:var(--parent)"></i><b>${left.toLocaleString("en-US")}</b> of ${hl.n.toLocaleString("en-US")} ${plain(hl.key)} left</span>`;
  $("hl-expect").innerHTML = `<span><i class="dot" style="--c:var(--daughter)"></i>${(hl.n - left).toLocaleString("en-US")} decayed to ${plain(daughter.key)}${hl.key === "U-238" ? " (through 13 short-lived steps)" : ""}</span>`;
  $("hl-time").innerHTML = `Time: <b>${timeText(n.half[0] * hl.t, n.half[1])}</b> = ${hl.t.toFixed(2)} half-lives. Expected left: ${num(hl.n * M.fraction(hl.t), 3)} (${(100 * M.fraction(hl.t)).toPrecision(3)}%)`;
  $("hl-cap").textContent = `${info.name} left over time (half-life ${halfText(n)})`;
  $("skip").disabled = hl.t >= T_MAX - 1e-9 || hl.target !== null;
  drawGraph();
}

function drawGrid(now) {
  const d = devicePixelRatio || 1, W = grid.clientWidth, H = grid.clientHeight;
  if (!W || !H || !hl.times) return;
  if (grid.width !== Math.round(W * d) || grid.height !== Math.round(H * d)) { grid.width = Math.round(W * d); grid.height = Math.round(H * d); }
  const ctx = gctx; ctx.setTransform(d, 0, 0, d, 0, 0); ctx.clearRect(0, 0, W, H);
  const pad = 12, cols = Math.ceil(Math.sqrt(hl.n * (W - 2 * pad) / (H - 2 * pad))), rows = Math.ceil(hl.n / cols);
  const step = Math.min((W - 2 * pad) / cols, (H - 2 * pad) / rows), r = step * 0.36;
  const ox = (W - cols * step) / 2 + step / 2, oy = (H - rows * step) / 2 + step / 2;
  const P = css("--parent"), D = css("--daughter");
  for (let i = 0; i < hl.n; i++) {
    const x = ox + (i % cols) * step, y = oy + Math.floor(i / cols) * step, alive = hl.times[i] > hl.t;
    if (alive) drawBall(ctx, P, x, y, r);
    else { ctx.fillStyle = D; ctx.globalAlpha = 0.55; ctx.beginPath(); ctx.arc(x, y, r * 0.8, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
    const f = hl.flash[i];
    if (f > 0) { ctx.strokeStyle = `rgba(232,120,12,${f})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, r * (1 + 1.6 * (1 - f)), 0, 7); ctx.stroke(); }
  }
}

function drawGraph() {
  const svg = $("hl-graph"), W = svg.clientWidth, H = svg.clientHeight;
  if (!W || !H) return;
  const R = rem(), n = M.NUCLIDES[hl.key], L = 3.4 * R, T = 0.8 * R, Rm = 1.6 * R, wide = W > 26 * R, B = (wide ? 4.2 : 3.2) * R, pw = W - L - Rm, ph = H - T - B;
  const X = (t) => L + t / T_MAX * pw, Y = (p) => T + (1 - p / 100) * ph;
  let s = "";
  for (const p of [0, 25, 50, 75, 100]) s += `<path d="M${L},${Y(p)} H${L + pw}" stroke="var(--bg)" stroke-width="1.5"/><text x="${L - 0.5 * R}" y="${Y(p)}" text-anchor="end" dominant-baseline="middle">${p}%</text>`;
  [[1, 50, "½"], [2, 25, "¼"], [3, 12.5, "⅛"]].forEach(([t, p, f]) => {
    s += `<path d="M${X(t)},${Y(p)} V${Y(0)} M${L},${Y(p)} H${X(t)}" stroke="var(--text2)" stroke-width="1.2" stroke-dasharray="3 5"/>`;
    s += `<text class="frac" x="${X(t) + 0.35 * R}" y="${Y(p) - 0.45 * R}">${f}</text>`;
  });
  s += `<path d="M${L},${T} V${T + ph} H${L + pw}" fill="none" stroke="var(--ink)" stroke-width="${0.12 * R}"/>`;
  for (let t = 0; t <= T_MAX; t++) {
    s += `<text x="${X(t)}" y="${T + ph + 1.1 * R}" text-anchor="middle">${t}</text>`;
    if (wide && t > 0 && t % 2 === 1 && t < T_MAX) s += `<text x="${X(t)}" y="${T + ph + 2.1 * R}" text-anchor="middle" style="font-size:.72rem">${num(n.half[0] * t, 4)} ${n.half[1]}</text>`;
  }
  s += `<text class="axis-label" x="${L + pw / 2}" y="${T + ph + (wide ? 3.5 : 2.5) * R}" text-anchor="middle">Time (half-lives)</text>`;
  // Theory: N₀(½)^(t/t½).
  const theory = [];
  for (let t = 0; t <= T_MAX + 1e-9; t += 0.05) theory.push(`${X(t).toFixed(1)},${Y(100 * 0.5 ** t).toFixed(1)}`);
  s += `<polyline points="${theory.join(" ")}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="7 6"/>`;
  // The sample, as a step line up to now, and its decayed share rising.
  const sorted = Array.from(hl.times).filter((x) => x <= hl.t).sort((a, b) => a - b);
  const up = [`${X(0)},${Y(100)}`], dn = [`${X(0)},${Y(0)}`];
  let left = hl.n;
  for (const x of sorted) { const px = X(x).toFixed(1); up.push(`${px},${Y(100 * left / hl.n).toFixed(1)}`); dn.push(`${px},${Y(100 - 100 * left / hl.n).toFixed(1)}`); left--; up.push(`${px},${Y(100 * left / hl.n).toFixed(1)}`); dn.push(`${px},${Y(100 - 100 * left / hl.n).toFixed(1)}`); }
  up.push(`${X(hl.t).toFixed(1)},${Y(100 * left / hl.n).toFixed(1)}`); dn.push(`${X(hl.t).toFixed(1)},${Y(100 - 100 * left / hl.n).toFixed(1)}`);
  s += `<polyline points="${dn.join(" ")}" fill="none" stroke="var(--daughter)" stroke-width="${0.15 * R}" stroke-linejoin="round"/>`;
  s += `<polyline points="${up.join(" ")}" fill="none" stroke="var(--parent)" stroke-width="${0.17 * R}" stroke-linejoin="round"/>`;
  s += `<circle cx="${X(hl.t)}" cy="${Y(100 * left / hl.n)}" r="${0.42 * R}" fill="var(--parent)" stroke="var(--surface)" stroke-width="${0.12 * R}"/>`;
  // Legend in the empty upper right.
  const lx = L + pw * 0.52, ly = T + 0.8 * R;
  s += `<path d="M${lx},${ly} h${1.6 * R}" stroke="var(--parent)" stroke-width="${0.17 * R}"/><text x="${lx + 2 * R}" y="${ly}" dominant-baseline="middle">${plain(hl.key)} left (this sample)</text>`;
  s += `<path d="M${lx},${ly + 1.3 * R} h${1.6 * R}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="7 6"/><text x="${lx + 2 * R}" y="${ly + 1.3 * R}" dominant-baseline="middle">N₀(½)^(t / t½)</text>`;
  s += `<path d="M${lx},${ly + 2.6 * R} h${1.6 * R}" stroke="var(--daughter)" stroke-width="${0.15 * R}"/><text x="${lx + 2 * R}" y="${ly + 2.6 * R}" dominant-baseline="middle">Decayed</text>`;
  svg.innerHTML = s;
}

function calc() {
  const n = M.NUCLIDES[hl.key], [h, u] = n.half, n0 = parseFloat($("c-n0").value), t = parseFloat($("c-t").value), pct = parseFloat($("c-pct").value);
  if (n0 >= 0 && t >= 0) {
    const k = t / h, leftAmt = n0 * 0.5 ** k;
    $("c-left").textContent = `${num(leftAmt, 3)} g left`;
    $("c-work").innerHTML = `N = N₀ × (½)<sup>t / t½</sup> = ${num(n0)} × (½)<sup>${num(t)} / ${num(h)}</sup> = ${num(n0)} × (½)<sup>${num(k, 3)}</sup> = <b>${num(leftAmt, 3)} g</b>`;
  } else { $("c-left").textContent = ""; $("c-work").textContent = "Enter a starting amount and a time of 0 or more."; }
  if (pct > 0 && pct <= 100) {
    const k = M.halfLivesFor(pct / 100), age = k * h;
    $("c-age").textContent = timeText(age, u);
    $("c-agework").innerHTML = `t = t½ × log₂(N₀ / N) = ${num(h)} × log₂(100 / ${num(pct)}) = ${num(h)} × ${num(k, 3)} = <b>${timeText(age, u)}</b>`;
  } else { $("c-age").textContent = ""; $("c-agework").textContent = "Enter a percentage above 0 and up to 100."; }
}

function stepHalf(dt) {
  if (!hl.times) return;
  for (let i = 0; i < hl.flash.length; i++) if (hl.flash[i] > 0) hl.flash[i] = Math.max(0, hl.flash[i] - dt * 2);
  const before = hl.t;
  if (hl.target !== null) {
    hl.t = Math.min(hl.target, hl.t + dt / (reduce ? 1e-3 : 0.35) );
    if (hl.t >= hl.target - 1e-9) { hl.t = hl.target; hl.target = null; }
  } else if (hl.playing) {
    hl.t = Math.min(T_MAX, hl.t + dt / SECONDS_PER_HALF);
    if (hl.t >= T_MAX) setPlaying(false);
  }
  if (hl.t !== before) {
    if (!reduce) for (let i = 0; i < hl.n; i++) if (hl.times[i] > before && hl.times[i] <= hl.t) hl.flash[i] = 1;
    renderHalf();
  }
}

/* ---------- Tabs, controls, loop ---------- */

const tabs = [...document.querySelectorAll('[role="tab"]')];
let activeTab = "decay";
function show(id) {
  activeTab = id;
  for (const b of tabs) b.setAttribute("aria-selected", b.dataset.tab === id);
  $("decay-panel").hidden = id !== "decay"; $("half-panel").hidden = id !== "half";
  for (const g of document.querySelectorAll(".acts")) g.hidden = g.dataset.for !== id;
  if (id === "decay") drawChart(); else renderHalf();
}
tabs.forEach((b) => (b.onclick = () => show(b.dataset.tab)));
$("start").onchange = () => { decayState.start = $("start").value; restartDecay(); };
$("decay").onclick = () => { decayState.showLast = false; doDecay(); };
$("auto").onclick = () => {
  decayState.auto = !decayState.auto;
  if (decayState.auto && !decayState.anim) { decayState.showLast = false; doDecay(); }
  renderDecay();
};
$("reset").onclick = () => (activeTab === "decay" ? restartDecay() : restartHalf());
$("hl-pick").onchange = () => { hl.key = $("hl-pick").value; restartHalf(); };
for (const b of document.querySelectorAll(".seg button")) b.onclick = () => { hl.n = +b.dataset.n; restartHalf(); };
$("play").onclick = () => setPlaying(!hl.playing);
$("skip").onclick = () => { hl.target = Math.min(T_MAX, Math.floor(hl.t + 1e-6) + 1); setPlaying(false); renderHalf(); };
for (const id of ["c-n0", "c-t", "c-pct"]) $(id).oninput = calc;
addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey || /INPUT|SELECT/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === "1") show("decay"); else if (k === "2") show("half");
  else if (k === "r") $("reset").click();
  else if (k === "d" && activeTab === "decay") $("decay").click();
  else if (k === "p" && activeTab === "half") $("play").click();
});
new ResizeObserver(() => { drawChart(); drawGraph(); }).observe(document.querySelector("main"));

fillStarts(); fillHalfPicker();
restartDecay(); restartHalf();
show("decay");

let prev = performance.now();
(function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;
  if (activeTab === "decay") { stepDecay(dt); drawScene(now); }
  else { stepHalf(dt); drawGrid(now); }
  requestAnimationFrame(frame);
})(prev);
</script>
</body>
</html>
