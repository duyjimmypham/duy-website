<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Le Chatelier</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}

@media(prefers-reduced-motion:no-preference){@view-transition{navigation:auto}}
body{color:var(--anatomy-strong);font:18px/1.4 "Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.iso-page{width:auto;margin:0}
.page{max-width:1600px;min-height:100vh;margin:0 auto;padding:12px 20px;display:flex;flex-direction:column;gap:12px}
.card{padding:12px 20px;border-radius:6px;background:var(--anatomy-card);box-shadow:var(--anatomy-lift)}
h1{margin:0;font-size:20px;font-weight:600}
.title{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;padding-block:10px}
.controls{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-size:16px;color:inherit;cursor:pointer;transition:background-color .12s,border-color .12s,color .12s}
.reactions{display:flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:8px;background:var(--anatomy-page);box-shadow:inset 0 0 0 1px var(--anatomy-faint)}
.reactions button{height:32px;padding:0 14px;border:0;border-radius:5px;background:none}
.reactions button:hover{background:var(--anatomy-faint)}
.reactions button[aria-pressed=true]{background:var(--anatomy-strong);color:var(--anatomy-card)}
#reset{display:flex;align-items:center;gap:6px;height:38px;padding:0 14px 0 12px;border:1px solid var(--anatomy-lo);border-radius:8px;background:var(--anatomy-face)}
.site-nav{display:flex}
.site-nav a{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px 0 14px;border:1px solid var(--anatomy-lo);border-radius:8px;background:var(--anatomy-face);color:inherit;font-size:16px;text-decoration:none;transition:border-color .12s}
#reset:hover,.site-nav a:hover{border-color:var(--anatomy-strong)}
#reset svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px}
.status{font-weight:600}
.equation{display:flex;gap:14px;font-size:30px;line-height:1.2}
.equation>div{display:flex;flex-direction:column;align-items:center;gap:6px}
.pill{padding:0 10px;border:2px solid var(--c);border-radius:999px;background:color-mix(in srgb,var(--c) 10%,transparent);font-size:15px;line-height:1.4;white-space:nowrap}
/* The equation sits left of the flask; an equal empty column on the right keeps the flask centred. */
.stage{flex:1 0 270px;min-height:0;display:flex;align-items:flex-start;gap:12px}
.side{flex:1 1 0;min-width:max-content}
.side .card{width:max-content;max-width:100%}
.stage::after{content:"";flex:1 1 0}
.stage svg{flex:0 1 auto;min-width:0;width:auto;height:100%}
.sliders{display:flex;flex-wrap:wrap;gap:12px}
.concs{display:contents}
.sliders .card{flex:1 1 calc(33.333% - 8px);min-width:0;display:flex;flex-direction:column;gap:2px;padding-block:10px 8px}
.head{display:flex;justify-content:space-between;gap:12px}
.head span{color:var(--anatomy-text)}
/* Each track fills up to the thumb (--f) and keeps a tick where the slider started (--s); the thumb covers the tick until it moves. */
input[type=range]{--f:0;--s:0;-webkit-appearance:none;appearance:none;width:100%;height:28px;margin:0;cursor:pointer;
  background:linear-gradient(var(--anatomy-mid),var(--anatomy-mid)) calc(10px + (100% - 20px) * var(--s)) 50%/2px 14px no-repeat}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--anatomy-strong) calc(11px + (100% - 22px) * var(--f)),var(--anatomy-faint) 0)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--anatomy-faint)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--anatomy-strong)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:var(--anatomy-face);border:2px solid var(--anatomy-strong);box-shadow:0 1px 3px #0000002e;transition:box-shadow .12s}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--anatomy-face);border:2px solid var(--anatomy-strong);box-shadow:0 1px 3px #0000002e}
input[type=range]:hover::-webkit-slider-thumb{box-shadow:0 1px 3px #0000002e,0 0 0 6px #18181a14}
input[type=range]:active::-webkit-slider-thumb{box-shadow:0 1px 3px #0000002e,0 0 0 8px #18181a1f}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--anatomy-card),0 0 0 5px #3e63dd}
input[type=range]:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px var(--anatomy-card),0 0 0 5px #3e63dd}
button:focus-visible,a:focus-visible{outline:2px solid #3e63dd;outline-offset:2px}
.footer{display:flex;justify-content:space-between;align-items:baseline;gap:4px 24px;flex-wrap:wrap;font-size:16px;padding-block:10px}
.credit{display:flex;gap:20px;color:var(--anatomy-text)}
.footer a{color:inherit;text-decoration-color:var(--anatomy-lo)}
@media (prefers-reduced-motion:reduce){button,.site-nav a,input[type=range]::-webkit-slider-thumb{transition:none}}
.iso-svg .gas{mix-blend-mode:multiply;fill:#9b4aa0}
.iso-svg .glint{fill:none;stroke:#fff;stroke-width:2.4px;stroke-linecap:round;opacity:.85}
.iso-svg .glint.thin{stroke-width:1.4px}
.iso-svg .bead{fill:var(--anatomy-shade-0);stroke:var(--anatomy-hi);stroke-width:.6px}
.iso-svg .glow{fill:transparent}
.iso-svg .lamp{fill:var(--anatomy-shade-0);stroke:none}
.photo{display:block;isolation:isolate}
.photo .backdrop{fill:var(--anatomy-page)}
.photo .tint{mix-blend-mode:color}
.photo .glow{mix-blend-mode:multiply;fill:transparent}
.photo .pointer{fill:none;stroke:#1c1c1e;stroke-width:4;stroke-linecap:round}
.photo .needle{stroke-width:2.6}
@media (max-width:900px){.sliders .card{flex-basis:calc(50% - 6px)}.stage{flex:none;flex-direction:column;align-items:center}.stage::after{display:none}.side{flex:none;min-width:0;align-self:stretch}.stage svg{width:100%;height:auto;max-height:70vh}}
@media (max-width:560px){.sliders .card{flex-basis:100%}.equation{font-size:24px}.controls,.reactions{width:100%}.reactions button{flex:1 1 auto}}

@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}
`;
const G = {"P":{"origin":[220,357.7921233851125],"scale":1.6445931729869814,"azimuth":45,"elevation":30},"KNOB":[32,62,13],"GAUGE_R":17,"GAUGE_TOP":185};
// The isometric flask (flask.html). Inlined after the kit by build.mjs; G holds the build geometry.
const svg = document.querySelector('.stage svg');
const part = (name) => svg.querySelector(`[data-part="${name}"]`);
const els = { gas: svg.querySelectorAll('[data-part=gas]'), beads: svg.querySelectorAll('.bead'), glow: part('glow'), lamp: part('lamp'), knob: part('knob'), needle: part('needle') };

function figure(v) {
  els.gas.forEach((g) => { g.style.fill = v.gas; g.style.opacity = v.strength.toFixed(3); });
  const pellets = Math.round(v.pellets * els.beads.length);
  els.beads.forEach((b) => { b.style.display = b.dataset.i < pellets ? '' : 'none'; });
  els.glow.style.fill = v.glow;
  els.glow.style.opacity = v.glowStrength;
  els.lamp.style.fill = v.lamp;
  const [x, y, z] = G.KNOB, on = (r) => [x + Math.sin(v.knob) * r, y + 8.1, z + Math.cos(v.knob) * r];
  els.knob.setAttribute('d', pathOf([iso(on(1), G.P), iso(on(4.4), G.P)]));
  const a = v.needle, r = G.GAUGE_R - 4;
  els.needle.setAttribute('d', lineOnTop([-Math.sin(a) * 2.6, Math.cos(a) * 2.6], [Math.sin(a) * r, -Math.cos(a) * r], G.GAUGE_TOP + 0.2, G.P));
}
// Shared live code for flask.html and flask-render.html. Each page defines figure(view) before this file.
const E = window.Equilibrium;
const $ = (id) => document.getElementById(id);
const R_GAS = 0.082057;

// A + B ⇌ C, all gases, endothermic, K = 2 at 293.15 K as on chatelier.cyrusyip.com.
// A species with a tint is coloured.
E.reactions.abc = {
  name: 'A + B ⇌ C',
  species: [
    { id: 'A', label: 'A', nu: -1, n0: 0.5, color: '#ef4444', tint: 1 },
    { id: 'B', label: 'B', nu: -1, n0: 0.5, color: '#ef4444', tint: 1 },
    { id: 'C', label: 'C', nu: 1, n0: 0.5, color: '#6050dc', tint: 1 },
  ],
  dH: 40, Kp: 2 / (R_GAS * 293.15), Tref: 293.15, T0: 293.15, Tmin: 273.15, Tmax: 373.15, unit: 0.01,
};

// What the page says and the slider ranges for each reaction; the chemistry is in model.js.
// c: [max, step] in M for every concentration; p: [min, max, step] in atm.
const SETUPS = {
  abc: { name: 'Generic', colours: ['Red', 'Red', 'Majorelle blue'], c: [5, 0.01], p: [5, 150, 0.1] },
  no2: { name: 'Nitrogen dioxide', colours: ['Colourless', 'Brown'], c: [0.2, 0.0001], p: [0.2, 6, 0.01] },
  hi: { name: 'Hydrogen iodide', colours: ['Colourless', 'Violet', 'Colourless'], c: [0.2, 0.0001], p: [1, 25, 0.05] },
  haber: { name: 'Ammonia', colours: ['Colourless', 'Colourless', 'Colourless'], c: [5, 0.01], p: [40, 600, 1] },
};

let shown, r, setup, c, T, P, P0;

$('reactions').innerHTML = Object.entries(SETUPS).map(([key, { name }]) => `<button type="button" data-reaction="${key}">${name}</button>`).join('');
$('reactions').onclick = (e) => { const b = e.target.closest('[data-reaction]'); if (b) load(b.dataset.reaction); };

function load(key) {
  const start = E.create(key);
  shown = key;
  r = start.r;
  setup = SETUPS[key];
  c = E.concentrations(start);
  T = r.T0;
  const { species, dH } = r;
  document.querySelectorAll('[data-reaction]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.reaction === key));
  $('heat').textContent = `This reaction is ${dH > 0 ? 'endothermic' : 'exothermic'}, ΔH° = ${dH > 0 ? '+' : '−'}${Math.abs(dH)} kJ/mol.`;
  const labels = species.map((sp) => sp.label);
  $('gases').textContent = `${labels.slice(0, -1).join(', ')} and ${labels.at(-1)} are ${labels.length > 2 ? 'all' : 'both'} gases.`;
  // Each species over a pill naming its colour.
  const term = (sp) => `<div><span>${Math.abs(sp.nu) > 1 ? `${Math.abs(sp.nu)} ` : ''}${sp.label}</span><span class="pill" style="--c:${sp.tint ? sp.color : 'var(--anatomy-lo)'}">${setup.colours[species.indexOf(sp)]}</span></div>`;
  const side = (list) => list.map(term).join('<div>+</div>');
  $('equation').innerHTML = `${side(species.filter((sp) => sp.nu < 0))}<div>⇌</div>${side(species.filter((sp) => sp.nu > 0))}`;
  const [cMax, cStep] = setup.c;
  $('concs').innerHTML = species.map((sp, i) => `<div class="card"><div class="head"><label for="c${i}">Concentration of ${sp.label}</label><span id="c${i}Value"></span></div>
    <input type="range" id="c${i}" min="${cStep}" max="${cMax}" step="${cStep}" value="${c[i]}"></div>`).join('');
  Object.assign($('temperature'), { min: r.Tmin, max: r.Tmax, step: 0.05, value: T });
  const [pMin, pMax, pStep] = setup.p;
  Object.assign($('pressure'), { min: pMin, max: pMax, step: pStep, value: E.pressure(start) });
  P = P0 = +$('pressure').value;  // the start, on the slider's own steps
  $('catalyst').value = 0;
  update();
  ranges().forEach((el) => el.style.setProperty('--s', along(el)));  // the start tick
}

// The sliders are the conditions and stay where they are set; the page answers at once and nothing moves afterwards.
$('concs').oninput = (e) => { c[+e.target.id.slice(1)] = +e.target.value; update(); };
$('temperature').oninput = (e) => { T = +e.target.value; update(); };
$('pressure').oninput = (e) => { P = +e.target.value; update(); };
$('catalyst').oninput = update;
$('reset').onclick = () => load(shown);

const ranges = () => document.querySelectorAll('input[type=range]');
// How far along its track a slider sits, 0 to 1.
const along = (el) => (el.value - el.min) / (el.max - el.min);

function update() {
  const digits = setup.c[0] < 1 ? 4 : 2;
  c.forEach((v, i) => { $(`c${i}Value`).textContent = `${v.toFixed(digits)} M`; });
  $('pressureValue').textContent = `${P.toFixed(P < 10 ? 2 : 1)} atm`;
  $('temperatureValue').textContent = `${T.toFixed(2)} K`;
  $('catalystValue').textContent = `${$('catalyst').value} g`;
  ranges().forEach((el) => el.style.setProperty('--f', along(el)));
  // Pressure squeezes every concentration by P/P0; only temperature moves K. A catalyst moves neither.
  const gap = Math.log(E.quotient(r, c.map((v) => v * P / P0), 1) / E.Kc(r, T));
  $('status').textContent = Math.abs(gap) < 0.01 ? 'The reaction is in equilibrium.' : `The reaction shifts to the ${gap < 0 ? 'right' : 'left'}.`;
  draw(gap);
}

// Dials sweep 270° clockwise from lower left.
const turn = (share) => -Math.PI * 0.75 + Math.min(1, share) * Math.PI * 1.5;
// The colour of each side of the equation, or undefined when that side is colourless.
const colourOf = (sign) => r.species.find((sp) => sp.tint && Math.sign(sp.nu) === sign)?.color;

function draw(gap) {
  // The gas leans toward the colour of the side the reaction shifts to: 1 / (1 + √(Q/K)), a half at equilibrium.
  const right = 1 / (1 + Math.exp(gap / 2));
  const [from, to] = [colourOf(-1), colourOf(1)];
  const share = (from ? 1 - right : 0) + (to ? right : 0);
  const { T0, Tmin, Tmax } = r;
  const heat = (T - T0) / (T >= T0 ? Tmax - T0 : T0 - Tmin);  // −1 coldest, 1 hottest
  figure({
    gas: from && to ? `color-mix(in oklab, ${to} ${(100 * right).toFixed(1)}%, ${from})` : from || to || 'transparent',
    strength: 0.8 * share,
    density: share,
    pellets: $('catalyst').value / 100,
    glow: heat > 0 ? '#ff6a2a' : '#8fd3ff',
    glowStrength: heat > 0 ? 0.55 * heat : -0.7 * heat,
    lamp: heat > 0.01 ? '#ff5a1f' : heat < -0.01 ? '#3aa0ff' : '',
    knob: turn((T - Tmin) / (Tmax - Tmin)),
    needle: turn(P / setup.p[1]),
  });
}

load('abc');
</script></body></html>
