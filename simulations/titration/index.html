'use strict';
// Ideal aqueous solutions at 25 °C; concentrations in mol/L, volumes in L.
// Solve electroneutrality over the entire titration, including water equilibrium.
function solutionAt(volumeMl, acid = 'hcl') {
  const totalVolume = (25 + volumeMl) / 1000;
  const acidTotal = 0.0025 / totalVolume;
  const sodium = (0.1 * volumeMl / 1000) / totalVolume;
  const ka = 1.8e-5;
  let low = -2, high = 16;
  for (let i = 0; i < 64; i++) {
    const pH = (low + high) / 2;
    const h = 10 ** -pH;
    const residual = h - 1e-14 / h + (sodium - acidTotal)
      + (acid === 'acetic' ? acidTotal * h / (ka + h) : 0);
    if (residual > 0) low = pH;
    else high = pH;
  }
  const pH = (low + high) / 2;
  const hydrogen = 10 ** -pH;
  const anion = acid === 'acetic' ? acidTotal * ka / (ka + hydrogen) : acidTotal;
  return {pH, hydrogen, hydroxide: 1e-14 / hydrogen, sodium, anion,
    undissociated: acid === 'acetic' ? acidTotal * hydrogen / (ka + hydrogen) : 0, totalVolume};
}

  const [low, high] = indicator.range;
  const f = Math.max(0, Math.min(1, (pH - low) / (high - low)));
  const mix = acidColor.map((value, i) => Math.round(value + (baseColor[i] - value) * f));

// Titration simulation: the buret, its drops and stream, the readout, and the two
// animation scripts. Pure functions with no DOM; build.mjs inlines this file.

const DROP_ML = 0.05;
const CAPACITY_ML = 50;
// Approximate real flow for each stopcock position, in mL/s.
const FLOW = { closed: 0, dropwise: 0.05, half: 0.2, full: 0.5 };
const POSITIONS = ["closed", "dropwise", "half", "full"];
const SUBSTEP = 1 / 120;
const EPS = 1e-9;

// delivered: mL that has left the buret (the meniscus).
// landed: mL that has reached the flask (readout, pH, color).
// Always delivered === landed + forming + the mL of drops in flight.
function createBuret({ fallSeconds = 0.13 } = {}) {
  return { position: "closed", delivered: 0, landed: 0, forming: 0, falling: [], pendingDrops: 0, fallSeconds };
}

const isStream = (position) => FLOW[position] > FLOW.dropwise;

function setPosition(buret, position) {
  // A drop already forming when the stopcock closes finishes and falls.
  if (position === "closed") return { ...buret, position, pendingDrops: buret.forming > 0 ? Math.max(buret.pendingDrops, 1) : buret.pendingDrops };
  // A stream carries a hanging drop straight into the flask.
  if (isStream(position)) return { ...buret, position, landed: buret.landed + buret.forming, forming: 0, pendingDrops: 0 };
  return { ...buret, position, pendingDrops: 0 };
}

// One quick open-and-close of a closed stopcock: exactly one more drop. While it is open,
// the flow is already set by its position, so a flick does nothing.
const flick = (buret) => (buret.position === "closed" ? { ...buret, pendingDrops: buret.pendingDrops + 1 } : buret);

const refill = (buret) => createBuret({ fallSeconds: buret.fallSeconds });

function substep(buret, h, events) {
  let { position, delivered, landed, forming, pendingDrops } = buret;
  const room = CAPACITY_ML - delivered;
  const rate = position === "closed" ? (pendingDrops > 0 ? FLOW.dropwise : 0) : FLOW[position];
  // A forming drop takes no more than its 0.05 mL, so each drop is exact and none is left over.
  const flow = Math.min(rate * h, room, isStream(position) ? Infinity : DROP_ML - forming);
  delivered += flow;
  if (isStream(position)) landed += flow;
  else forming += flow;
  let falling = buret.falling.map((drop) => ({ ...drop, t: drop.t + h }));
  const full = delivered >= CAPACITY_ML - EPS;
  if (forming >= DROP_ML - EPS || (full && forming > 0)) {
    falling.push({ t: 0, ml: forming >= DROP_ML - EPS ? DROP_ML : forming });
    forming = forming - DROP_ML > EPS ? forming - DROP_ML : 0;
    if (pendingDrops > 0) pendingDrops--;
  }
  for (const drop of falling.filter((drop) => drop.t >= buret.fallSeconds)) {
    landed += drop.ml;
    events.push({ type: "land", ml: drop.ml, landed });
  }
  falling = falling.filter((drop) => drop.t < buret.fallSeconds);
  if (full) {
    // Pin the end exactly at capacity so the readout shows 50.00.
    delivered = CAPACITY_ML;
    landed = CAPACITY_ML - forming - falling.reduce((sum, drop) => sum + drop.ml, 0);
    position = "closed";
    pendingDrops = 0;
  }
  return { ...buret, position, delivered, landed, forming, falling, pendingDrops };
}

// The readout shows the flask to 0.01 mL, with the pH and color of that same volume.
function readout(landedMl, model) {
  const ml = Math.round(landedMl * 100) / 100;
  const { pH } = model.solutionAt(ml, "hcl");
  const look = model.indicators.phenolphthalein.appearance(pH, ml);
  return { ml: ml.toFixed(2), pH: pH.toFixed(2), state: look.state, color: look.color };
}

// White-tile's splash rule: a landing drop's local pink lingers longer as the acid runs out.
const flashSeconds = (landedMl) => 0.3 + 2.7 * (1 - Math.max(0, 1 - landedMl / 25)) ** 6;
const flashColor = (model) => model.indicators.phenolphthalein.appearance(14, 50).color;

// Buret graduations around a reading: every 0.1 mL, longer at 0.5, numbered at whole mL.
function magnifierTicks(buretMl, halfWindowMl = 1) {
  const from = Math.max(0, Math.ceil((buretMl - halfWindowMl) * 10 - EPS));
  const to = Math.min(CAPACITY_ML * 10, Math.floor((buretMl + halfWindowMl) * 10 + EPS));
  const ticks = [];
  for (let tenth = from; tenth <= to; tenth++) {
    const ml = tenth / 10;
    if (tenth % 10 === 0) ticks.push({ ml, kind: "whole", label: String(ml) });
    else ticks.push({ ml, kind: tenth % 5 === 0 ? "half" : "minor" });
  }
  return ticks;
}

function step(buret, dt) {
  const events = [];
  const count = Math.max(1, Math.ceil(dt / SUBSTEP - EPS));
  for (let index = 0; index < count; index++) buret = substep(buret, dt / count, events);
  return { buret, events };
}

// The two animations. `speed` compresses time while pouring; drops run at real pace.
const SCRIPTS = {
  careful: [
    { kind: "hold", seconds: 1.5 },
    { kind: "flow", position: "full", untilMl: 22, speed: 4 },
    { kind: "flow", position: "half", untilMl: 24.5, speed: 4 },
    { kind: "drops", speed: 1 },
    { kind: "end" },
  ],
  overshoot: [
    { kind: "hold", seconds: 1.5 },
    { kind: "flow", position: "full", untilMl: 27, speed: 4 },
    { kind: "end" },
  ],
};

const createRun = (name, { fallSeconds = 0.13 } = {}) =>
  ({ name, phase: 0, phaseT: 0, buret: createBuret({ fallSeconds }), speed: 1, done: false, waitUntil: null });

// Advance a script by `dt` seconds of wall time.
function advance(run, dt, model) {
  const events = [];
  let { phase, phaseT, buret, waitUntil, done } = run;
  const script = SCRIPTS[run.name];
  const next = () => { phase++; phaseT = 0; waitUntil = null; };
  const idle = (seconds) => {
    const result = step(buret, seconds);
    buret = result.buret;
    events.push(...result.events);
    phaseT += seconds;
    return result.events;
  };
  let left = dt;
  while (left > EPS && !done) {
    const current = script[phase];
    if (current.kind === "hold") {
      const take = Math.min(left, current.seconds - phaseT);
      idle(take);
      left -= take;
      if (phaseT >= current.seconds - EPS) next();
    } else if (current.kind === "flow") {
      if (buret.position !== current.position) buret = setPosition(buret, current.position);
      const need = (current.untilMl - buret.landed) / FLOW[current.position];
      const take = Math.min(left * current.speed, need);
      idle(take);
      left -= take / current.speed;
      if (take >= need - EPS) {
        // Land exactly on the limit before closing, so the next phase starts from it.
        const over = buret.landed - current.untilMl;
        buret = setPosition({ ...buret, landed: current.untilMl, delivered: buret.delivered - over }, "closed");
        next();
      }
    } else if (current.kind === "drops") {
      if (waitUntil === null) { buret = flick(buret); waitUntil = Infinity; }
      // Waiting for the drop to land, then for it to mix in.
      const take = Math.min(left, waitUntil === Infinity ? SUBSTEP : waitUntil - phaseT);
      const landed = idle(take);
      left -= take;
      if (landed.length) waitUntil = phaseT + flashSeconds(buret.landed);
      else if (phaseT >= waitUntil - EPS) {
        if (readout(buret.landed, model).state === "colorless") waitUntil = null;
        else next();
      }
    } else {
      done = true;
      idle(left);
      left = 0;
    }
  }
  const speed = done ? 1 : script[phase].speed ?? 1;
  return { run: { ...run, phase, phaseT, buret, speed, done, waitUntil }, events };
}

// Live view: draws the simulation into the SVG that build.mjs wrote. GEOM and the sim
// functions are inlined before this file; solutionAt and indicators are page globals.
const MODEL = { solutionAt, indicators };
const { origin: O, camera: C, AXIS: AX, FZ, TIP_Z, ZERO, PER_ML, BODY_Z, BR_IN, FACING, CONE, PADDLES, tip: TIP, magnifier: MAG } = GEOM;
const TAU = Math.PI * 2;
const PADDLE_INDEX = { closed: 0, dropwise: 2, half: 5, full: 9 };
const STREAM_WIDTH = { half: 1.8, full: 3.2 };
// Whole millilitres ring the tube, as on a real buret; their numbers sit outside it.
const TICK_LENGTH = { minor: 8, half: 13, whole: 2 * MAG.wall };

const stage = document.querySelector(".iso-stage");
const readoutEl = document.querySelector("[data-readout]");
const photo = document.querySelector(".photo");
// Each live part appears once per look (the drawing, the realistic layer); every write goes to all.
const el = Object.fromEntries(["liquid", "sheen", "surface", "stirbar", "flash", "ripple", "stream", "drop", "forming", "column", "top", "meniscus", "paddle", "paddle-hit", "stir-frame", "cock-frame", "magnifier", "mag-ticks", "mag-reading", "mag-strip"]
  .map((name) => [name, [...stage.querySelectorAll(`[data-part="${name}"]`)]]));
const set = (parts, name, value) => parts.forEach((node) => node.setAttribute(name, value));
const unset = (parts, name) => parts.forEach((node) => node.removeAttribute(name));
const css = (parts, name, value) => parts.forEach((node) => { node.style[name] = value; });
// A sprite sheet shows one frame by moving its viewBox down the stacked frames.
const showFrame = (node, index) => { const box = node.viewBox.baseVal; box.y = index * box.height; };
const [stirEdge, stirBody] = el.stirbar[0].querySelectorAll("path");
// The stir bar turns about 1.5 times a second: slower than a real stirrer, so the eye can follow it.
const STIR_TURNS = 1.5;
let stirAngle = 0;
const still = matchMedia("(prefers-reduced-motion: reduce)");
stage.style.setProperty("--flash", flashColor(MODEL));

const iso = ([x, y, z]) => [O[0] + (x * C.sinA - y * C.cosA) * C.k, O[1] + ((x * C.cosA + y * C.sinA) * C.sinE - z * C.cosE) * C.k];
const circle = (z, r, from = 0, span = TAU, n = 48) => Array.from({ length: n + (span < TAU ? 1 : 0) }, (_, i) => {
  const t = from + (span * i) / n;
  return iso([AX[0] + r * Math.cos(t), AX[1] + r * Math.sin(t), z]);
});
const pathFrom = (points, closed = true) => "M" + points.map(([x, y]) => x.toFixed(1) + " " + y.toFixed(1)).join("L") + (closed ? "Z" : "");
function hull(points) {
  const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const half = (list) => list.reduce((out, p) => { while (out.length > 1 && cross(out[out.length - 2], out[out.length - 1], p) <= 0) out.pop(); out.push(p); return out; }, []);
  const lower = half(sorted), upper = half(sorted.reverse());
  return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
// Height of the flask contents on the inner cone, from their volume in mL.
const levelOf = (ml) => (CONE.a - Math.cbrt((CONE.a - CONE.b * CONE.s0) ** 3 - (3 * CONE.b * ml * CONE.perMl) / Math.PI)) / CONE.b;
const down = (h) => "translate(0 " + (h * C.cosE * C.k).toFixed(2) + ")";

let flash = null; // the pink where the last drop landed, while it mixes in
let paddleShown = -1;
let ticksFor = null;

function drawMagnifier(delivered) {
  const key = delivered.toFixed(3);
  if (key === ticksFor) return;
  ticksFor = key;
  const marks = [];
  const labels = [];
  for (const tick of magnifierTicks(delivered, MAG.r / MAG.perMl)) {
    const y = ((tick.ml - delivered) * MAG.perMl).toFixed(1);
    marks.push(`M${-MAG.wall} ${y}h${TICK_LENGTH[tick.kind]}`);
    if (tick.label) labels.push(`<text class="mag-label" x="${MAG.wall + 5}" y="${(Number(y) + 5.5).toFixed(1)}">${tick.label}</text>`);
  }
  el["mag-ticks"][0].innerHTML = `<path class="mag-tick" d="${marks.join("")}"/>${labels.join("")}`;
  el["mag-reading"].forEach((node) => { node.textContent = delivered.toFixed(2) + " mL"; });
  el.magnifier.forEach((node) => { node.dataset.reading = delivered.toFixed(2); });
  el["mag-strip"].forEach((node) => node.setAttribute("y", ((node.dataset.fromMl - delivered) * node.dataset.perMl).toFixed(2)));
}

function render(buret, look) {
  const s = levelOf(25 + buret.landed);
  const surfaceZ = FZ + s;
  const surfaceR = CONE.a - CONE.b * s;
  const body = pathFrom(hull([...circle(FZ + 1.6, 27.2), ...circle(FZ + 4.4, 28.4), ...circle(surfaceZ, surfaceR)]));
  stage.style.setProperty("--liquid", look.color);
  set(el.liquid, "d", body);
  set(el.sheen, "d", body);
  set(el.surface, "d", pathFrom(circle(surfaceZ, surfaceR)));

  // The stir bar lies on the flask floor, seen through the solution; a round-capped stroke is its pill shape.
  const { half, r } = GEOM.stirbar;
  const [dx, dy] = [half * Math.cos(stirAngle), half * Math.sin(stirAngle)];
  const [a, b] = [iso([AX[0] - dx, AX[1] - dy, FZ + 1.6 + r]), iso([AX[0] + dx, AX[1] + dy, FZ + 1.6 + r])];
  const bar = `M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}`;
  stirEdge.setAttribute("d", bar);
  stirBody.setAttribute("d", bar);
  stirEdge.style.strokeWidth = (2 * r * C.k + 1.2).toFixed(2);
  stirBody.style.strokeWidth = (2 * r * C.k).toFixed(2);
  el["stir-frame"].forEach((node) => showFrame(node, Math.round((stirAngle / Math.PI) * node.dataset.frames) % node.dataset.frames));

  const zm = ZERO - buret.delivered * PER_ML;
  set(el.column, "d", pathFrom(hull([...circle(BODY_Z, BR_IN, 0, TAU, 32), ...circle(zm, BR_IN, 0, TAU, 32)])));
  set(el.top, "d", pathFrom(circle(zm, BR_IN, 0, TAU, 32)));
  set(el.meniscus, "d", pathFrom(circle(zm, BR_IN, FACING - Math.PI / 2, Math.PI, 24), false));

  // A drop grows at the tip, then falls under gravity to the surface.
  if (buret.forming > 0) {
    const grow = ((buret.forming / DROP_ML) ** (1 / 3)).toFixed(3);
    set(el.forming, "transform", `translate(${TIP[0]} ${TIP[1]}) scale(${grow}) translate(${-TIP[0]} ${-TIP[1]})`);
    css(el.forming, "opacity", "1");
  } else css(el.forming, "opacity", "0");
  const falling = buret.falling[0];
  if (falling) {
    set(el.drop, "transform", down((TIP_Z - surfaceZ) * (falling.t / buret.fallSeconds) ** 2));
    css(el.drop, "opacity", "1");
  } else css(el.drop, "opacity", "0");

  if (STREAM_WIDTH[buret.position]) {
    const [x0, y0] = iso([AX[0], AX[1], TIP_Z]), [x1, y1] = iso([AX[0], AX[1], surfaceZ]);
    set(el.stream, "d", `M${x0.toFixed(1)} ${y0.toFixed(1)}L${x1.toFixed(1)} ${y1.toFixed(1)}`);
    css(el.stream, "strokeWidth", STREAM_WIDTH[buret.position]);
  } else unset(el.stream, "d");

  if (flash) {
    const share = flash.t / flash.seconds;
    set(el.flash, "d", pathFrom(circle(surfaceZ + 0.05, Math.min(3 + 14 * Math.sqrt(share), surfaceR - 0.8))));
    css(el.flash, "opacity", (0.85 * (1 - share)).toFixed(2));
    const wave = flash.t / 0.45;
    if (wave < 1) {
      set(el.ripple, "d", pathFrom(circle(surfaceZ + 0.05, Math.min(1.5 + 9 * wave, surfaceR - 0.8))));
      css(el.ripple, "opacity", (1 - wave).toFixed(2));
    } else unset(el.ripple, "d");
  } else {
    css(el.flash, "opacity", "0");
    unset(el.ripple, "d");
  }

  // During a one-drop flick the handle is cracked open although the setting is closed.
  const shown = buret.position === "closed" && buret.pendingDrops > 0 ? "dropwise" : buret.position;
  const index = PADDLE_INDEX[shown];
  if (index !== paddleShown) {
    paddleShown = index;
    el.paddle.forEach((node) => { node.innerHTML = PADDLES[index]; });
    set(el["paddle-hit"], "d", PADDLES[index].match(/class="iso-fill" d="([^"]+)"/)[1]);
    el["cock-frame"].forEach((node) => showFrame(node, node.dataset.positions.split(",").indexOf(shown)));
  }

  drawMagnifier(buret.delivered);
  const text = `${look.ml} mL, pH ${look.pH}, ${look.state}`;
  if (readoutEl.textContent !== text) readoutEl.textContent = text;
  const colorless = look.state === "colorless"; // the photo shows from the first lasting pink on
  if (photo.hidden !== colorless) photo.hidden = colorless;
  Object.assign(stage.dataset, {
    delivered: buret.delivered.toFixed(2), landed: buret.landed.toFixed(2), position: buret.position,
    forming: buret.forming > 0 ? "1" : "0", falling: String(buret.falling.length), flash: flash ? "1" : "0",
    stir: ((stirAngle * 180) / Math.PI).toFixed(1),
  });
}

// 25.00 mL of 0.100 M HCl needs 25.00 mL of 0.100 M NaOH.
const EQUIVALENCE_ML = 25;
// The endpoint students see: the first whole drop that leaves the solution pink.
let ENDPOINT_ML = 0;
while (readout(ENDPOINT_ML, MODEL).state === "colorless") ENDPOINT_ML += DROP_ML;

const tabs = [...document.querySelectorAll('[role="tab"]')];
const animControls = document.querySelector('[data-controls="animation"]');
const manualControls = document.querySelector('[data-controls="manual"]');
const playButton = document.querySelector('[data-action="play"]');
const speedEl = document.querySelector("[data-speed]");
const noteEl = document.querySelector("[data-note]");
const radios = [...document.querySelectorAll('input[name="stopcock"]')];

// What is on screen: one of the two animations, or the Manual buret, which keeps its state.
const fallSeconds = () => (still.matches ? 0 : 0.13);
let current = "careful";
let anim = null;
let manual = createBuret({ fallSeconds: fallSeconds() });
const buretOf = () => (current === "manual" ? manual : anim.run.buret);

function select(name) {
  current = name;
  tabs.forEach((tab) => {
    tab.setAttribute("aria-selected", String(tab.dataset.tab === name));
    tab.tabIndex = tab.dataset.tab === name ? 0 : -1;
  });
  animControls.hidden = name === "manual";
  manualControls.hidden = name !== "manual";
  stage.dataset.mode = name;
  if (name !== "manual") replay();
  flash = null;
  noteEl.textContent = "";
}

function replay() {
  anim = { run: createRun(current, { fallSeconds: fallSeconds() }), playing: true, noted: false };
  playButton.textContent = "Pause";
  flash = null;
  noteEl.textContent = "";
}

function endNote(look) {
  if (current === "careful") return `Equivalence point: ${EQUIVALENCE_ML.toFixed(2)} mL. Endpoint, first lasting pink: ${look.ml} mL.`;
  return `Read ${look.ml} mL. The endpoint was ${ENDPOINT_ML.toFixed(2)} mL: ${(Number(look.ml) - ENDPOINT_ML).toFixed(2)} mL too much.`;
}

function setStopcock(position) {
  if (current === "manual" && position !== manual.position) manual = setPosition(manual, position);
}
const stepStopcock = (by) => setStopcock(POSITIONS[Math.max(0, Math.min(POSITIONS.length - 1, POSITIONS.indexOf(manual.position) + by))]);

function update(dt) {
  let events = [];
  if (current === "manual") ({ buret: manual, events } = step(manual, dt));
  else if (anim.playing && !anim.run.done) ({ run: anim.run, events } = advance(anim.run, dt, MODEL));
  // Pause holds the mixing pink and the stir bar along with everything else.
  const running = current === "manual" || anim.playing;
  if (flash && running && (flash.t += dt) >= flash.seconds) flash = null;
  if (running && !still.matches) stirAngle = (stirAngle + dt * STIR_TURNS * TAU) % Math.PI;
  const landed = events.at(-1);
  if (landed && !still.matches) flash = { t: 0, seconds: flashSeconds(landed.landed) };
}

// Controls and readouts that live outside the drawing.
function sync(buret, look) {
  if (current === "manual") {
    for (const radio of radios) if (radio.checked !== (radio.value === buret.position)) radio.checked = radio.value === buret.position;
    dropButton.disabled = buret.position !== "closed";
    return;
  }
  const speed = anim.playing && !anim.run.done && anim.run.speed > 1 ? `Pouring sped up ${anim.run.speed}×` : "";
  if (speedEl.textContent !== speed) speedEl.textContent = speed;
  if (anim.run.done && !anim.noted) { anim.noted = true; noteEl.textContent = endNote(look); }
}

tabs.forEach((tab, index) => {
  tab.addEventListener("click", () => select(tab.dataset.tab));
  tab.addEventListener("keydown", (event) => {
    const to = { ArrowRight: index + 1, ArrowLeft: index - 1, Home: 0, End: tabs.length - 1 }[event.key];
    if (to === undefined) return;
    event.preventDefault();
    const next = tabs[(to + tabs.length) % tabs.length];
    next.focus();
    select(next.dataset.tab);
  });
});
playButton.addEventListener("click", () => {
  anim.playing = !anim.playing;
  playButton.textContent = anim.playing ? "Pause" : "Play";
});
document.querySelector('[data-action="replay"]').addEventListener("click", replay);
const dropButton = document.querySelector('[data-action="drop"]');
dropButton.addEventListener("click", () => { manual = flick(manual); });
document.querySelector('[data-action="refill"]').addEventListener("click", () => { manual = refill(manual); flash = null; });
radios.forEach((radio) => radio.addEventListener("change", () => radio.checked && setStopcock(radio.value)));
// Arrow keys on the Stopcock buttons open and close one step, as on the figure, instead of
// the native radio wrap from Closed round to Full.
document.querySelector(".stopcock").addEventListener("keydown", (event) => {
  const by = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[event.key];
  if (by === undefined) return;
  event.preventDefault();
  stepStopcock(by);
  radios.find((radio) => radio.value === manual.position).focus();
});

// The drawn handle: click to turn it one position, or drag it up to open and down to close.
let drag = null;
[...el.paddle, ...el["paddle-hit"]].forEach((handle) => {
  handle.addEventListener("pointerdown", (event) => {
    if (current !== "manual") return;
    drag = { y: event.clientY, from: POSITIONS.indexOf(manual.position), moved: false };
    handle.setPointerCapture(event.pointerId);
  });
  handle.addEventListener("pointermove", (event) => {
    if (!drag) return;
    const steps = Math.round((drag.y - event.clientY) / 24);
    if (steps) drag.moved = true;
    setStopcock(POSITIONS[Math.max(0, Math.min(POSITIONS.length - 1, drag.from + steps))]);
  });
  handle.addEventListener("pointerup", () => {
    if (drag && !drag.moved) setStopcock(POSITIONS[(POSITIONS.indexOf(manual.position) + 1) % POSITIONS.length]);
    drag = null;
  });
});

stage.addEventListener("keydown", (event) => {
  const by = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[event.key];
  if (current !== "manual" || by === undefined) return;
  event.preventDefault();
  stepStopcock(by);
});
document.addEventListener("keydown", (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const key = event.key.toLowerCase();
  const onControl = event.target.closest?.("button, input");
  if (current === "manual" && key === "d") manual = flick(manual);
  else if (current === "manual" && key === "r") { manual = refill(manual); flash = null; }
  else if (current !== "manual" && key === "r") replay();
  else if (current !== "manual" && key === " " && !onControl) playButton.click();
  else return;
  event.preventDefault();
});
select("careful");

const looks = [...document.querySelectorAll('input[name="look"]')];
const showLook = (look) => {
  stage.dataset.look = look;
  for (const radio of looks) radio.checked = radio.value === look;
};
let stored = null;
try { stored = localStorage.getItem("titration-look"); } catch { /* storage blocked: start in Drawing */ }
showLook(stored === "realistic" ? "realistic" : "drawing");
looks.forEach((radio) => radio.addEventListener("change", () => {
  if (!radio.checked) return;
  showLook(radio.value);
  try { localStorage.setItem("titration-look", radio.value); } catch { /* not remembered */ }
}));
// Without its images (the page copied alone), Realistic is not offered; the stored choice is kept.
for (const href of new Set([...stage.querySelectorAll(".real image")].map((node) => node.getAttribute("href")))) {
  const probe = new Image();
  probe.onerror = () => {
    looks.find((radio) => radio.value === "realistic").disabled = true;
    showLook("drawing");
  };
  probe.src = href;
}

let last = 0;
let frame = 0;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 0.1) : 0;
  last = now;
  update(dt);
  const buret = buretOf();
  const look = readout(buret.landed, MODEL);
  render(buret, look);
  sync(buret, look);
  frame = document.visibilityState === "visible" ? requestAnimationFrame(tick) : 0;
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !frame) { last = 0; frame = requestAnimationFrame(tick); }
});
render(buretOf(), readout(0, MODEL));
frame = requestAnimationFrame(tick);
</script></body></html>
